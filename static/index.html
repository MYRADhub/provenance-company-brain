<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Provenance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
:root {
  /* App Starter design system tokens (digohq/app-starter apps/web/src/styles/tokens.css) */
  --color-soil: #0f172a; --color-stem: #4b5563; --color-mist: #e5e7eb; --color-dew: #f9fafb;
  --color-forest: #111827; --color-growth: #1f2937; --color-leaf: #6b7280; --color-spring: #f3f4f6;
  --color-destructive: #b91c1c; --color-destructive-muted: #fef2f2;
  --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px;
  --shadow-sm: 0 1px 2px rgba(15,23,42,.04), 0 1px 3px rgba(15,23,42,.04);
  --shadow-md: 0 2px 6px rgba(15,23,42,.04), 0 8px 24px rgba(15,23,42,.06);
  --transition-micro: 150ms ease-out;
  /* Page roles mapped onto the tokens */
  --bg: #ffffff; --panel: var(--color-dew); --card: #ffffff; --border: var(--color-mist); --hair: #eef0f3;
  --text: var(--color-soil); --muted: var(--color-stem); --faint: var(--color-leaf);
  --accent: var(--color-forest); --accent-soft: var(--color-spring); --on-accent: #f9fafb;
  --red: var(--color-destructive); --red-soft: var(--color-destructive-muted);
  --green: #15803d; --green-soft: #f0fdf4;
  --alert: #1d4ed8; --alert-soft: #eff6ff;
  --mono: "IBM Plex Mono", "SF Mono", Monaco, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --color-soil: #f3f4f6; --color-stem: #9ca3af; --color-mist: #374151; --color-dew: #1f2937;
    --color-forest: #f9fafb; --color-leaf: #9ca3af; --color-spring: #1f2937;
    --color-destructive: #f87171; --color-destructive-muted: #3b1414;
    --shadow-sm: 0 1px 3px rgba(0,0,0,.3); --shadow-md: 0 4px 16px rgba(0,0,0,.35);
    --bg: #111827; --panel: #0f1623; --card: #172031; --hair: #243042; --border: #2b3647; --on-accent: #0f172a;
    --green: #4ade80; --green-soft: #052e16; --alert: #93b4ff; --alert-soft: #16213a;
  }
}
:root[data-theme="dark"] {
  --color-soil: #f3f4f6; --color-stem: #9ca3af; --color-mist: #374151; --color-dew: #1f2937;
  --color-forest: #f9fafb; --color-leaf: #9ca3af; --color-spring: #1f2937;
  --color-destructive: #f87171; --color-destructive-muted: #3b1414;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.3); --shadow-md: 0 4px 16px rgba(0,0,0,.35);
  --bg: #111827; --panel: #0f1623; --card: #172031; --hair: #243042; --border: #2b3647; --on-accent: #0f172a;
  --green: #4ade80; --green-soft: #052e16; --alert: #93b4ff; --alert-soft: #16213a;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 14px/1.55 "IBM Plex Sans", -apple-system, BlinkMacSystemFont, sans-serif; -webkit-font-smoothing: antialiased;
  display: grid; grid-template-columns: 248px minmax(0, 1fr) 480px; height: 100vh; overflow: hidden;
  font-variant-numeric: tabular-nums;
}
button { font: inherit; cursor: pointer; color: inherit; }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.muted { color: var(--muted); } .faint { color: var(--faint); }
.hash { font-family: var(--mono); font-size: 12px; color: var(--faint); }
.link { background: none; border: none; padding: 0; color: var(--text); text-decoration: underline; text-decoration-color: var(--border); text-underline-offset: 3px; font-size: 13px; }
.link:hover { text-decoration-color: currentColor; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent); border-radius: var(--radius-sm); padding: 0 16px; min-height: 40px; font-size: 14px; font-weight: 500; transition: opacity var(--transition-micro); }
.btn:hover:not(:disabled) { opacity: .88; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.ghost { background: var(--card); color: var(--text); border-color: var(--border); }
.btn.sm { min-height: 32px; padding: 0 12px; font-size: 13px; }
.icon-btn { width: 32px; height: 32px; display: grid; place-items: center; border: 1px solid transparent; background: none; border-radius: var(--radius-sm); color: var(--muted); }
.icon-btn:hover { background: var(--accent-soft); color: var(--text); }
.spinner { width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--text); border-radius: 50%; animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- sidebar ---------- */
.side { background: var(--panel); border-right: 1px solid var(--hair); padding: 22px 16px 18px; display: flex; flex-direction: column; gap: 26px; overflow-y: auto; }
.brand { display: flex; align-items: flex-start; justify-content: space-between; padding: 0 6px; }
.brand h1 { font-size: 19px; font-weight: 600; margin: 0; letter-spacing: -.02em; }
.brand .firm { font-size: 13px; color: var(--muted); }
.slabel { font-size: 12px; color: var(--faint); margin: 0 6px 8px; }
.who-wrap { position: relative; }
.who-btn { width: 100%; display: flex; align-items: center; gap: 10px; text-align: left; padding: 8px; border: 1px solid var(--hair); border-radius: var(--radius-md); background: var(--card); box-shadow: var(--shadow-sm); }
.who-btn:hover { border-color: var(--border); }
.who-btn .n { font-weight: 500; font-size: 13px; line-height: 1.3; }
.who-btn .t { font-size: 12px; color: var(--muted); line-height: 1.3; }
.who-btn .chev { margin-left: auto; color: var(--faint); }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--accent-soft); color: var(--text); display: grid; place-items: center; font-weight: 500; font-size: 11px; flex: none; border: 1px solid var(--hair); }
.menu { position: absolute; z-index: 30; left: 0; right: 0; top: calc(100% + 6px); background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--shadow-md); padding: 6px; }
.menu button { width: 100%; display: flex; align-items: center; gap: 10px; text-align: left; padding: 8px; border: none; background: none; border-radius: var(--radius-sm); }
.menu button:hover, .menu button.on { background: var(--accent-soft); }
.menu .n { font-size: 13px; font-weight: 500; line-height: 1.3; } .menu .t { font-size: 12px; color: var(--muted); line-height: 1.3; }
.deal-row { display: block; width: 100%; text-align: left; border: none; background: none; padding: 9px 10px; border-radius: var(--radius-sm); }
.deal-row:hover { background: var(--accent-soft); }
.deal-row.sel { background: var(--card); box-shadow: var(--shadow-sm); outline: 1px solid var(--hair); }
.deal-row .c { font-size: 14px; font-weight: 500; }
.deal-row .m { font-size: 12px; color: var(--muted); }
.lockline { display: flex; gap: 8px; align-items: flex-start; font-size: 12px; color: var(--faint); padding: 0 6px; line-height: 1.45; }
.lockline svg { margin-top: 1px; width: 14px; height: 14px; }
.side .grow { flex: 1; }

/* ---------- center ---------- */
.center { display: flex; flex-direction: column; min-width: 0; height: 100vh; }
.topbar { padding: 18px 32px; border-bottom: 1px solid var(--hair); display: flex; align-items: baseline; gap: 10px; }
.topbar .deal { font-size: 15px; font-weight: 600; }
.topbar .co { font-size: 13px; color: var(--muted); }
.msgs { flex: 1; overflow-y: auto; padding: 28px 32px; display: flex; flex-direction: column; gap: 22px; }
.msgs > * { width: 100%; max-width: 720px; margin-left: auto; margin-right: auto; }
.empty { margin: auto; text-align: center; }
.empty h2 { font-size: 24px; font-weight: 600; letter-spacing: -.02em; margin: 0 0 6px; }
.empty p { color: var(--muted); margin: 0 0 26px; }
.sugs { display: flex; flex-direction: column; gap: 10px; max-width: 520px; margin: 0 auto; }
.sug { display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left; border: 1px solid var(--hair); background: var(--card); border-radius: var(--radius-md); padding: 14px 16px; font-size: 14px; box-shadow: var(--shadow-sm); transition: border-color var(--transition-micro), transform var(--transition-micro); }
.sug:hover { border-color: var(--border); transform: translateY(-1px); }
.sug svg { color: var(--faint); }
.msg-user { align-self: flex-end; display: flex; justify-content: flex-end; }
.msg-user span { background: var(--accent-soft); color: var(--text); padding: 10px 16px; border-radius: 16px 16px 4px 16px; max-width: 560px; }
.msg-bot { line-height: 1.65; }
.msg-bot.err { color: var(--red); }
.md { overflow-wrap: anywhere; }
.md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
.md h1, .md h2, .md h3, .md h4 { font-size: 14px; font-weight: 600; margin: 18px 0 6px; }
.md p { margin: 0 0 10px; }
.md ul, .md ol { padding-left: 20px; margin: 0 0 10px; }
.md li { margin: 3px 0; }
.md strong { font-weight: 600; }
.md em { font-style: normal; color: var(--muted); }
.md table { border-collapse: collapse; margin: 8px 0; font-size: 13px; }
.md th, .md td { border-bottom: 1px solid var(--hair); padding: 6px 10px; text-align: left; }
.md code { font-family: var(--mono); font-size: 12px; background: var(--accent-soft); padding: 1px 5px; border-radius: 4px; }
.md blockquote { margin: 8px 0; padding: 2px 14px; border-left: 2px solid var(--border); color: var(--muted); }
.src-toggle { margin-top: 12px; background: none; border: none; padding: 0; font-size: 12px; color: var(--faint); display: inline-flex; align-items: center; gap: 6px; }
.src-toggle:hover { color: var(--text); }
.src-toggle svg { width: 12px; height: 12px; transition: transform var(--transition-micro); }
.src-toggle.open svg { transform: rotate(90deg); }
.sources { margin-top: 10px; padding: 14px 16px; background: var(--panel); border-radius: var(--radius-md); font-size: 13px; }
.sources .sl { display: flex; gap: 8px; align-items: baseline; padding: 3px 0; }
.sources .sl svg { width: 13px; height: 13px; color: var(--faint); align-self: center; }
.sources .kind { color: var(--faint); font-size: 12px; }
.sources h5 { font-size: 12px; font-weight: 500; color: var(--faint); margin: 12px 0 4px; }
.sources h5:first-child { margin-top: 0; }
.sources .step { color: var(--muted); padding: 2px 0; }
.sources .q { color: var(--faint); }
.thinking { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
.composer { padding: 14px 32px 22px; }
.composer form { display: flex; gap: 10px; max-width: 720px; margin: 0 auto; align-items: flex-end; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 8px 8px 8px 16px; box-shadow: var(--shadow-md); }
.composer textarea { flex: 1; resize: none; border: none; outline: none; font: inherit; background: none; color: var(--text); min-height: 24px; max-height: 160px; padding: 8px 0; }
.composer .btn { min-height: 36px; border-radius: 10px; }

/* alert card (chat) */
.alert { border: 1px solid var(--hair); border-left: 3px solid var(--alert); background: var(--card); border-radius: var(--radius-md); padding: 16px 18px; box-shadow: var(--shadow-sm); }
.alert .ah { display: flex; align-items: flex-start; gap: 10px; }
.alert .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--alert); margin-top: 7px; flex: none; }
.alert .at { font-weight: 600; }
.alert .as { font-size: 13px; color: var(--muted); }
.alert .x { margin-left: auto; }
.alert .ab { margin-top: 10px; font-size: 13.5px; position: relative; }
.alert .ab.clamp { max-height: 4.9em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 55%, transparent); mask-image: linear-gradient(#000 55%, transparent); }
.alert .more { margin-top: 8px; }

/* ---------- right panel ---------- */
.right { background: var(--panel); border-left: 1px solid var(--hair); padding: 22px 22px 28px; display: flex; flex-direction: column; gap: 18px; overflow-y: auto; }
.rhead { display: flex; align-items: center; gap: 8px; }
.rhead h3 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
.rhead .sp { flex: 1; }
.card { background: var(--card); border: 1px solid var(--hair); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); }
.tl-card { padding: 16px 16px 8px; }
.tl-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; padding: 0 2px; }
.tl-head .mname { font-weight: 600; }
.tl-head .cnt { font-size: 12px; color: var(--faint); }
.tl-head .sp { flex: 1; }
.msel { font: inherit; font-weight: 600; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--card); color: var(--text); padding: 4px 8px; }
.cmp-hint { font-size: 12px; color: var(--muted); background: var(--panel); border-radius: var(--radius-sm); padding: 8px 10px; margin: 0 0 8px; }
.tl-row { display: grid; cursor: pointer; border-radius: var(--radius-md); transition: background var(--transition-micro); }
.tl-row:hover { background: var(--panel); }
.tl-row.sel { background: var(--panel); }
.tl-row.fresh { animation: flash 2.4s ease-out; }
@keyframes flash { 0%, 30% { background: var(--alert-soft); } 100% { background: transparent; } }
.rail { display: flex; flex-direction: column; }
.rail svg { display: block; }
.rail .fill { flex: 1; min-height: 0; position: relative; }
.rail .fill svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.tl-body { padding: 12px 10px 12px 2px; min-width: 0; }
.tl-main { display: flex; gap: 12px; align-items: flex-start; }
.tl-text { flex: 1; min-width: 0; }
.tl-msg { font-size: 14px; line-height: 20px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.tl-meta { font-size: 12px; color: var(--muted); margin-top: 3px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.tl-meta .hash { opacity: 0; transition: opacity var(--transition-micro); }
.tl-row:hover .tl-meta .hash, .tl-row.sel .tl-meta .hash { opacity: 1; }
.bchip { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); }
.bchip i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.tagi { display: inline-flex; align-items: center; gap: 3px; color: var(--faint); }
.tagi svg { width: 13px; height: 13px; }
.kpi { text-align: right; flex: none; line-height: 1.25; }
.kpi .v { font-size: 15px; font-weight: 600; }
.kpi .d { font-size: 12px; }
.kpi .l { font-size: 11px; color: var(--faint); }
.up { color: var(--green); } .down { color: var(--red); }
.details { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--hair); cursor: default; }
.mline { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; padding: 3px 0; }
.mline .k { color: var(--muted); }
.mline .arrow { color: var(--faint); margin: 0 4px; }
.details .vinfo { font-size: 12px; color: var(--faint); margin: 10px 0 6px; }
table.cells { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
table.cells th { text-align: left; font-weight: 500; color: var(--faint); padding: 4px 6px; border-bottom: 1px solid var(--hair); }
table.cells td { padding: 6px; border-bottom: 1px solid var(--hair); vertical-align: top; }
table.cells td.where { color: var(--faint); white-space: nowrap; }
table.cells .old { color: var(--faint); text-decoration: line-through; }
table.cells .fx { font-family: var(--mono); font-size: 11px; color: var(--faint); margin-top: 2px; overflow-wrap: anywhere; }
.cmp-card { padding: 16px 18px; }
.cmp-card .ct { font-weight: 600; margin-bottom: 8px; }
.stale-card { padding: 16px 18px; }
.stale-card h4 { margin: 0 0 10px; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.stale-card h4 .n { font-size: 12px; font-weight: 500; color: var(--red); background: var(--red-soft); padding: 1px 8px; border-radius: 99px; }
.srow { display: flex; gap: 10px; padding: 10px 0; border-top: 1px solid var(--hair); }
.srow:first-of-type { border-top: none; padding-top: 2px; }
.srow svg { color: var(--faint); margin-top: 2px; }
.srow .tt { font-weight: 500; font-size: 13.5px; }
.srow .ln { font-size: 13px; color: var(--muted); }
.srow .ow { font-size: 12px; color: var(--faint); margin-top: 2px; }
.ok-line { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); padding: 0 4px; }
.ok-line svg { color: var(--green); }
.empty-r { text-align: center; color: var(--muted); padding: 44px 16px; font-size: 13px; }
.notice { font-size: 13px; color: var(--red); background: var(--red-soft); border-radius: var(--radius-sm); padding: 10px 12px; }
.menu-wrap { position: relative; }
.menu-wrap .menu { left: auto; right: 0; width: 200px; }
.import { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.import label { font-size: 13px; font-weight: 500; }
.import input { font: inherit; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 9px 12px; background: var(--card); color: var(--text); }
.import .hint { font-size: 12px; color: var(--faint); }
.import .row { display: flex; gap: 8px; }
#toasts { position: fixed; left: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 50; max-width: 360px; }
.toast { background: var(--card); color: var(--text); border: 1px solid var(--hair); box-shadow: var(--shadow-md); border-radius: var(--radius-md); padding: 10px 14px; font-size: 13px; transition: opacity .3s, transform .3s; }
.toast.err { color: var(--red); }
.toast.out { opacity: 0; transform: translateY(6px); }

/* ---------- governance ---------- */
.nav-row { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: none; background: none; padding: 9px 10px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 500; }
.nav-row:hover { background: var(--accent-soft); }
.nav-row.sel { background: var(--card); box-shadow: var(--shadow-sm); outline: 1px solid var(--hair); }
.nav-row svg { color: var(--muted); }
.req-link { margin: 6px 0 0 28px; font-size: 12px; }
body.gov .center, body.gov .right { display: none; }
#gov { display: none; grid-column: 2 / 4; overflow-y: auto; height: 100vh; padding: 28px 40px 48px; }
body.gov #gov { display: block; }
.gov-in { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.gov-in h2 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -.02em; }
.gov-in .lead { color: var(--muted); margin: 4px 0 0; }
.gcard { padding: 20px 22px; }
.gcard h3 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
.gcard .sub { font-size: 13px; color: var(--muted); margin: 0 0 14px; }
table.matrix { width: 100%; border-collapse: collapse; }
table.matrix th { font-weight: 500; font-size: 13px; text-align: center; padding: 8px 10px; color: var(--muted); }
table.matrix th:first-child { text-align: left; }
table.matrix th .co { display: block; font-size: 11px; color: var(--faint); font-weight: 400; }
table.matrix td { border-top: 1px solid var(--hair); padding: 10px; text-align: center; }
table.matrix td:first-child { text-align: left; }
table.matrix .pn { font-weight: 500; font-size: 13.5px; } table.matrix .pt { font-size: 12px; color: var(--muted); }
.sw { position: relative; width: 36px; height: 20px; border-radius: 99px; border: none; background: var(--color-mist); padding: 0; transition: background var(--transition-micro); vertical-align: middle; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: transform var(--transition-micro); }
.sw.on { background: var(--accent); }
.sw.on::after { transform: translateX(16px); background: var(--on-accent); }
.sw:disabled { opacity: .5; cursor: default; }
.rq { display: flex; gap: 14px; align-items: flex-start; padding: 14px 0; border-top: 1px solid var(--hair); }
.rq:first-of-type { border-top: none; padding-top: 4px; }
.rq .body { flex: 1; min-width: 0; }
.rq .who { font-weight: 500; font-size: 13.5px; }
.rq .when { font-size: 12px; color: var(--faint); margin-left: 6px; font-weight: 400; }
.rq .why { font-size: 13.5px; color: var(--text); margin-top: 3px; }
.rq .acts { display: flex; gap: 8px; align-items: center; flex: none; }
.rq select { font: inherit; font-size: 13px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--card); color: var(--text); padding: 6px 8px; }
.rq.done { opacity: .6; }
.rq .st { font-size: 12px; color: var(--muted); margin-top: 3px; }
.chips { display: flex; gap: 6px; margin-bottom: 10px; }
.chip { border: 1px solid var(--hair); background: var(--card); color: var(--muted); border-radius: 99px; padding: 4px 12px; font-size: 12px; }
.chip.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.ev { display: flex; gap: 12px; padding: 9px 0; border-top: 1px solid var(--hair); font-size: 13.5px; align-items: baseline; }
.ev:first-of-type { border-top: none; }
.ev .t { width: 92px; flex: none; font-size: 12px; color: var(--faint); }
.ev .d { width: 6px; height: 6px; border-radius: 50%; background: var(--color-mist); flex: none; align-self: center; }
.ev.blocked .d { background: var(--red); }
.ev.blocked .x { color: var(--red); }
.ev .q { color: var(--muted); }
.modal-bg { position: fixed; inset: 0; background: rgba(15,23,42,.28); display: grid; place-items: center; z-index: 60; padding: 16px; }
.modal { width: 100%; max-width: 460px; background: var(--card); border: 1px solid var(--hair); border-radius: var(--radius-lg); box-shadow: var(--shadow-md); padding: 22px; }
.modal h3 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
.modal p { margin: 0 0 12px; font-size: 13px; color: var(--muted); }
.modal textarea { width: 100%; min-height: 96px; font: inherit; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; background: var(--card); color: var(--text); resize: vertical; }
.modal .row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
.modal .mine { margin-top: 18px; border-top: 1px solid var(--hair); padding-top: 12px; }
.modal .mine h4 { margin: 0 0 6px; font-size: 12px; font-weight: 500; color: var(--faint); }
.modal .mr { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; padding: 5px 0; }
.modal .mr .s { flex: none; font-size: 12px; padding: 1px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--muted); }
.modal .mr .s.approved { background: var(--green-soft); color: var(--green); }
.modal .mr .s.declined { background: var(--red-soft); color: var(--red); }
@media (max-width: 1320px) { body { grid-template-columns: 220px minmax(0,1fr) 420px; } .msgs, .composer, .topbar { padding-left: 24px; padding-right: 24px; } }
@media (max-width: 900px) {
  body { grid-template-columns: 1fr; height: auto; overflow: auto; }
  .center { height: auto; min-height: 80vh; }
  .side, .right { border: none; }
  .msgs { padding: 16px; } .composer, .topbar { padding-left: 16px; padding-right: 16px; }
}
.sources .sl a { color: var(--text); text-decoration: underline; text-decoration-color: var(--border); text-underline-offset: 3px; }
.sources .sl a:hover { text-decoration-color: currentColor; }
.sources .sl .file { display: block; font-size: 11px; color: var(--faint); }
.md a { color: var(--text); text-decoration: underline; text-decoration-color: var(--color-leaf); text-underline-offset: 3px; }
.tl-row.flash { animation: rowflash 1.6s ease-out; }
@keyframes rowflash { 0% { background: var(--accent-soft); } 100% { background: transparent; } }
</style>
</head>
<body>
<aside class="side">
  <div class="brand">
    <div><h1>Provenance</h1><div class="firm">Northbeam Capital</div></div>
    <button class="icon-btn" id="themeBtn" title="Switch light / dark" aria-label="Switch light or dark theme">
      <svg class="i" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
  <div>
    <div class="slabel">Viewing as</div>
    <div class="who-wrap" id="whoWrap"></div>
  </div>
  <div>
    <div class="slabel">Your deals</div>
    <div id="deals"></div>
  </div>
  <div id="adminNav"></div>
  <div class="grow"></div>
  <div>
    <div class="lockline">
      <svg class="i" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      <span id="lockText">You only see deals you're staffed on.</span>

</aside>

<main class="center">

  <div class="msgs" id="msgs"></div>

      <button class="btn" id="send" type="submit">Ask</button>
    </form>
  </div>
</main>

<aside class="right" id="right"></aside>
<section id="gov" aria-label="Access and governance"></section>
<div id="modalRoot"></div>

<script>
const S = { users: [], user: null, me: null, messages: [], busy: false, deal: null, models: [], model: null, graph: null, sel: [], changes: null, stale: null,
  alert: null, alertMeta: null, alertOpen: false, awaitingSave: false, fresh: null, seq: null, alertPolls: {}, importOpen: false, importBusy: false, importPath: "",
  compare: false, showCells: false, openSources: {}, whoOpen: false, moreOpen: false,
  view: "chat", gov: null, govErr: null, govBlockedOnly: false, govLimit: 30, govBusy: {}, reqOpen: false, reqMine: null, reqBusy: false, reqText: "" };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const md = (s) => (window.marked ? marked.parse(String(s ?? ""), { breaks: true }) : "<p>" + esc(s).replace(/\n/g, "<br>") + "</p>");
const initials = (n) => String(n || "?").split(/\s+/).map((p) => p[0]).slice(0, 2).join("").toUpperCase();
const enc = encodeURIComponent;
const ICON = {
  chev: '<svg class="i chev" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5"/></svg>',
  right: '<svg class="i" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>',
  arrow: '<svg class="i" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  doc: '<svg class="i" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>',
  shield: '<svg class="i" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"/></svg>',
  x: '<svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  dots: '<svg class="i" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>',
  check: '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>',
};

const PROMPTS = {
  priya: ["Why did FY26 EBITDA drop since the IC memo draft?", "Prep me for Thursday's call with Acme's CFO", "Which documents still use old numbers?"],
  marcus: ["What's our view on exit multiples for logistics deals?", "Tell me about Project Falcon", "Summarize where Harbor stands"],
  elena: ["Why did IRR jump in the latest version?", "What changed in Falcon this week, and does it break the IC memo?", "Why did we pass on Kestrel, and does it apply to Falcon?", "Which documents still use old numbers?"],
  david: ["Why did IRR jump in the latest version?", "Why did revenue growth drop from 12% to 8%?", "What does Elena think about logistics exit multiples?", "Which documents still use old numbers?"],
  sam: ["Who has access to Falcon materials?", "What is our information barrier policy?", "Summarize the IC process"],
};
const promptsFor = (email) => PROMPTS[String(email || "").split("@")[0]] || ["What deals am I working on?", "What changed recently?", "Summarize the IC process"];

async function api(path, opts = {}) {
  const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
  let body = null;
  try { body = await res.json(); } catch (_) { body = null; }
  if (!res.ok) {
    const err = new Error((body && (typeof body.detail === "string" ? body.detail : JSON.stringify(body.detail))) || `Request failed (${res.status})`);
    err.status = res.status;
    throw err;
  }
  return body;
}

/* ---------- formatting ---------- */
const pct = (v) => { if (v == null || isNaN(v)) return "--"; const n = Number(v); const p = Math.abs(n) <= 1.5 ? n * 100 : n; return p.toFixed(1).replace(/\.0$/, "") + "%"; };
const money = (v) => (v == null || isNaN(v) ? "--" : "$" + Number(v).toFixed(1) + "M");
const mult = (v) => (v == null || isNaN(v) ? "--" : Number(v).toFixed(1) + "x");
const METRIC = {
  irr: { l: "IRR", f: pct, pts: true },
  exit_multiple: { l: "Exit multiple", f: mult },
  fy26_ebitda: { l: "FY26 EBITDA", f: money },
  revenue_growth: { l: "Revenue growth", f: pct, pts: true },
  moic: { l: "MOIC", f: (v) => (v == null || isNaN(v) ? "--" : Number(v).toFixed(2) + "x") },
  ebitda_margin: { l: "EBITDA margin", f: pct, pts: true },
  fy26_revenue: { l: "FY26 revenue", f: money },
};
const PRIORITY = Object.keys(METRIC);
const fmtMetric = (k, v) => (METRIC[k] ? METRIC[k].f(v) : fmtVal(v));
const metricName = (k) => (METRIC[k] ? METRIC[k].l : String(k || "").replace(/_/g, " "));
function fmtVal(v) {
  if (v == null || v === "") return "--";
  if (typeof v === "number") return Math.abs(v) < 1 && v !== 0 ? pct(v) : String(Number(v.toFixed(4)));
  const n = Number(v);
  if (!isNaN(n) && String(v).trim() !== "") return fmtVal(n);
  return String(v);
}
function deltaText(k, cur, prev) {
  if (prev == null || cur == null) return null;
  const a = Number(cur), b = Number(prev);
  if (isNaN(a) || isNaN(b) || Math.abs(a - b) < 1e-9) return null;
  const d = a - b, m = METRIC[k] || {};
  let txt;
  if (m.pts) { const scale = Math.abs(a) <= 1.5 && Math.abs(b) <= 1.5 ? 100 : 1; txt = Math.abs(d * scale).toFixed(1) + " pts"; }
  else if (k === "exit_multiple" || k === "moic") txt = Math.abs(d).toFixed(1) + "x";
  else if (m.f === money) txt = "$" + Math.abs(d).toFixed(1) + "M";
  else txt = Math.abs(d).toFixed(1);
  return { cls: d > 0 ? "up" : "down", txt: (d > 0 ? "+" : "−") + txt };
}
const changedMetrics = (m, pm) => PRIORITY.filter((k) => m && pm && m[k] != null && pm[k] != null && Math.abs(Number(m[k]) - Number(pm[k])) > 1e-9);
const shortDate = (s) => { if (!s) return ""; const d = new Date(s); return isNaN(d) ? String(s) : d.toLocaleDateString(undefined, { month: "short", day: "numeric" }); };
function whenText(s) {
  const d = new Date(s); if (!s || isNaN(d)) return shortDate(s);
  const sec = (Date.now() - d.getTime()) / 1000;
  if (sec >= 0 && sec < 60) return "Just now";
  if (sec >= 0 && sec < 3600) return Math.round(sec / 60) + " min ago";
  if (sec >= 0 && sec < 86400) return "Today";
  return shortDate(s);
}
const userOf = (email) => S.users.find((u) => u.email === email) || null;
const nameOf = (email) => (userOf(email) || {}).name || email || "";
const firstName = (email) => String(nameOf(email)).split(" ")[0] || "";
const shortId = (id) => String(id || "").slice(0, 7);
const prettyMsg = (m) => String(m || "").replace(/->/g, "→").replace(/^Initial import$/i, "First version imported") || "Saved";

/* ---------- sources (plain-English trace) ---------- */
function stepText(t) {
  const n = t.tool || "", inp = t.input || {};
  if (n === "search_brain") return `Searched memos, calls and emails${inp.query ? ` <span class="q">"${esc(inp.query)}"</span>` : ""}`;
  if (n === "get_model_graph") return "Checked the model history";
  if (n === "diff_commits") return "Compared two versions of the model";
  if (n === "find_stale_references") return "Checked which documents use old numbers";
  if (n === "list_models" || n === "list_my_deals") return "Looked up your deals";
  return "Looked something up";
}
function sourcesHtml(key, cites, trace) {
  const n = (cites || []).length;
  if (!n && !(trace || []).length) return "";
  const open = !!S.openSources[key];
  const body = open ? `<div class="sources">
      ${n ? `<h5>Sources</h5>${cites.map((c) => `<div class="sl">${ICON.doc}<span>${c.url ? `<a href="${esc(c.url)}">${esc(c.title || c.id)}</a>` : esc(c.title || c.id)}${c.file ? `<span class="file">${esc(c.file)}</span>` : ""}</span>${c.kind ? `<span class="kind">${esc(String(c.kind).replace(/_/g, " "))}</span>` : ""}</div>`).join("")}` : ""}
      ${(trace || []).length ? `<h5>How I found this</h5>${trace.map((t) => `<div class="step">${stepText(t)}</div>`).join("")}` : ""}
    </div>` : "";
  return `<button class="src-toggle ${open ? "open" : ""}" data-src="${esc(key)}">${ICON.right}${n ? `Sources (${n})` : "How I found this"}</button>${body}`;
}

/* ---------- sidebar ---------- */
function renderWho() {
  const u = userOf(S.user) || {};
  const menu = S.whoOpen ? `<div class="menu" role="menu">${S.users.map((x) => `
      <button data-email="${esc(x.email)}" class="${x.email === S.user ? "on" : ""}"><span class="avatar">${esc(initials(x.name))}</span>
      <span><div class="n">${esc(x.name)}</div><div class="t">${esc(x.title)}</div></span></button>`).join("")}</div>` : "";
  $("whoWrap").innerHTML = `<button class="who-btn" id="whoBtn" aria-haspopup="menu"><span class="avatar">${esc(initials(u.name))}</span>
    <span><div class="n">${esc(u.name || "")}</div><div class="t">${esc(u.title || "")}</div></span>${ICON.chev}</button>${menu}`;
  $("whoBtn").addEventListener("click", (e) => { e.stopPropagation(); S.whoOpen = !S.whoOpen; renderWho(); });
  $("whoWrap").querySelectorAll(".menu button").forEach((b) => b.addEventListener("click", (e) => { e.stopPropagation(); S.whoOpen = false; if (b.dataset.email !== S.user) selectUser(b.dataset.email); else renderWho(); }));
}
function renderDeals() {
  const deals = (S.me && S.me.deals) || [];
  $("deals").innerHTML = deals.length
    ? deals.map((d) => `<button class="deal-row ${S.deal === d.id && S.view === "chat" ? "sel" : ""}" data-id="${esc(d.id)}"><div class="c">${esc(d.codename)}</div><div class="m">${esc(d.company)}</div></button>`).join("")
    : `<div class="lockline" style="padding:0 6px">No deals yet. You can still ask about firm policies and past decisions.</div>`;
  $("deals").querySelectorAll(".deal-row").forEach((c) => c.addEventListener("click", () => { setView("chat"); selectDeal(c.dataset.id); }));
  renderAdminNav();
  const u = S.me && S.me.user;
  $("lockText").textContent = u && u.role === "compliance" ? "You see firm-wide material only. Deal files stay with each deal team." : "You only see deals you're staffed on.";
}
function currentDeal() { return ((S.me && S.me.deals) || []).find((d) => d.id === S.deal) || null; }
function renderTop() {
  const d = currentDeal();
  $("topbar").innerHTML = d ? `<span class="deal">${esc(d.codename)}</span><span class="co">${esc(d.company)}</span>` : `<span class="deal">Firm knowledge</span>`;
}

/* ---------- chat ---------- */
function alertTitle() {
  const meta = S.alertMeta || {};
  const d = currentDeal();
  const who = meta.author ? ` by ${firstName(meta.author)}` : "";
  const what = d ? d.codename.replace(/^Project\s+/, "") + " model" : "Model";
  let count = 0;
  const lines = String((S.alert && S.alert.answer) || "").split("\n");
  const ai = lines.findIndex((l) => /action/i.test(l) && /\*\*|#/.test(l));
  if (ai >= 0) for (let i = ai + 1; i < lines.length && !/^\s*(\*\*|#)/.test(lines[i]); i++) if (/^\s*([-*]|\d+\.)\s/.test(lines[i])) count++;
  return { title: `${what} updated${who}`, sub: count ? `${count} thing${count === 1 ? "" : "s"} need${count === 1 ? "s" : ""} your attention` : prettyMsg(meta.message) };
}
function alertHtml() {
  if (S.awaitingSave) return `<div class="alert"><div class="ah"><span class="spinner" style="margin-top:3px"></span><div><div class="at">A model was just saved</div>
    <div class="as">Checking what changed, why, and which documents are affected. This takes about half a minute.</div></div></div></div>`;
  if (!S.alert) return "";
  const a = S.alert;
  if (a.error) return `<div class="alert"><div class="ah"><div class="dot" style="background:var(--red)"></div><div class="at">${esc(a.answer)}</div><button class="icon-btn x" id="closeAlert" aria-label="Dismiss">${ICON.x}</button></div></div>`;
  const t = alertTitle();
  return `<div class="alert"><div class="ah"><div class="dot"></div><div><div class="at">${esc(t.title)}</div><div class="as">${esc(t.sub)}</div></div>
      <button class="icon-btn x" id="closeAlert" aria-label="Dismiss">${ICON.x}</button></div>
    <div class="ab ${S.alertOpen ? "" : "clamp"}"><div class="md">${md(a.answer)}</div></div>
    <div class="more"><button class="link" id="alertMore">${S.alertOpen ? "Show less" : "Read more"}</button></div>
    ${S.alertOpen ? sourcesHtml("alert", a.citations, a.tool_trace) : ""}</div>`;
}
function renderMsgs() {
  const box = $("msgs");
  let html = alertHtml();
  if (!S.messages.length && !S.busy) {
    const d = currentDeal();
    html += `<div class="empty"><h2>What would you like to know${d ? ` about ${esc(d.codename)}` : ""}?</h2>
      <p>Answers draw on your deal files, models, memos, calls and emails.</p>
      <div class="sugs">${promptsFor(S.user).map((p) => `<button class="sug" data-p="${esc(p)}"><span>${esc(p)}</span>${ICON.arrow}</button>`).join("")}</div></div>`;
  } else {
    html += S.messages.map((m, i) => {
      if (m.role === "user") return `<div class="msg-user"><span>${esc(m.content)}</span></div>`;
      const noAccess = !m.error && !canManage() && /not cleared|cleared to see|walled|information barrier|contact Sam|don.t have access|restricted/i.test(m.content || "");
      return `<div class="msg-bot ${m.error ? "err" : ""}"><div class="md">${md(m.content)}</div>${noAccess ? `<div style="margin-top:10px"><button class="btn sm ghost" data-reqopen="1">Request access</button></div>` : ""}${m.error ? "" : sourcesHtml("m" + i, m.citations, m.trace)}</div>`;
    }).join("") + (S.busy ? `<div class="thinking"><span class="spinner"></span>Looking through the deal files...</div>` : "");
  }
  box.innerHTML = html;
  box.querySelectorAll("[data-p]").forEach((c) => c.addEventListener("click", () => ask(c.dataset.p)));
  box.querySelectorAll("[data-reqopen]").forEach((b) => b.addEventListener("click", openRequest));
  box.querySelectorAll("[data-src]").forEach((b) => b.addEventListener("click", () => { const k = b.dataset.src; S.openSources[k] = !S.openSources[k]; const top = box.scrollTop; renderMsgs(); box.scrollTop = top; }));
  const ca = $("closeAlert"); if (ca) ca.addEventListener("click", () => { S.alert = null; S.alertOpen = false; renderMsgs(); });
  const am = $("alertMore"); if (am) am.addEventListener("click", () => { S.alertOpen = !S.alertOpen; const top = box.scrollTop; renderMsgs(); box.scrollTop = top; });
  $("send").disabled = S.busy;
}
function scrollChat() { const box = $("msgs"); box.scrollTop = box.scrollHeight; }
async function ask(text) {
  text = String(text || "").trim();
  if (!text || S.busy || !S.user) return;
  S.messages.push({ role: "user", content: text });
  S.busy = true; renderMsgs(); scrollChat();
  const user = S.user;
  try {
    const history = S.messages.filter((m) => !m.error).map((m) => ({ role: m.role, content: m.content }));
    const r = await api("/api/chat", { method: "POST", body: JSON.stringify({ user, messages: history }) });
    if (user !== S.user) return;
    S.messages.push({ role: "assistant", content: r.answer || "(no answer)", trace: r.tool_trace, citations: r.citations });
  } catch (e) {
    if (user !== S.user) return;
    S.messages.push({ role: "assistant", content: e.message, error: true });
  } finally {
    if (user === S.user) { S.busy = false; renderMsgs(); scrollChat(); }
  }
}

/* ---------- right panel: model timeline ---------- */
const LANE_COLORS = ["#64748b", "#2563eb", "#d97706", "#059669", "#db2777", "#7c3aed"];
const LW = 14, GPAD = 11, TOP = 44, NY = 22;
const commitModelId = (c) => c && (c.model_id || (c.model && (c.model.id || c.model)) || null);

async function selectDeal(id) {
  S.deal = id; S.models = []; S.model = null; S.graph = null; S.sel = []; S.changes = null; S.stale = null; S.panelErr = null; S.compare = false; S.showCells = false;
  renderDeals(); renderTop(); renderRight(); if (!S.messages.length) renderMsgs();
  if (!id) return;
  const user = S.user;
  try {
    const [m, st] = await Promise.all([
      api(`/api/deals/${enc(id)}/models?user=${enc(user)}`),
      api(`/api/deals/${enc(id)}/stale?user=${enc(user)}`).catch((e) => ({ error: e.message })),
    ]);
    if (user !== S.user || id !== S.deal) return;
    S.models = Array.isArray(m) ? m : (m && m.models) || [];
    S.stale = st.error ? { error: st.error } : st.stale || [];
    if (S.models.length) { await selectModel(S.models[0].id, { keepPanel: true }); return; }
  } catch (e) {
    if (user !== S.user) return;
    S.panelErr = e.message;
  }
  renderRight();
}
async function selectModel(modelId, opts = {}) {
  S.model = modelId; S.sel = []; S.changes = null; S.showCells = false;
  if (!opts.keepPanel) renderRight();
  await loadGraph({ selectHead: true });
}
async function loadGraph({ selectHead = false, fresh = null } = {}) {
  if (!S.model) { renderRight(); return; }
  const user = S.user, model = S.model;
  try {
    const g = await api(`/api/models/${enc(model)}/graph?user=${enc(user)}`);
    if (user !== S.user || model !== S.model) return;
    S.graph = normalizeGraph(g);
    S.panelErr = null;
    if (fresh) { S.fresh = fresh; S.compare = false; S.sel = [fresh]; S.showCells = false; await loadDiff(); }
  } catch (e) {
    if (user !== S.user) return;
    S.panelErr = e.message; S.graph = null;
  }
  renderRight();
}
function normalizeGraph(g) {
  g = g || {};
  const commits = (g.commits || []).filter((c) => c && c.id).map((c) => ({ ...c, tags: c.tags || [] }));
  (g.tags || []).forEach((t) => {
    const cid = t.commit_id || t.commit || t.quoted_commit;
    const c = commits.find((x) => x.id === cid);
    const label = t.title || t.name || t.doc_title || t.label;
    if (c && label && !c.tags.some((x) => tagLabel(x) === label)) c.tags.push(label);
  });

async function loadDiff() {

    if (S.compare) { S.changes = null; return; }
    const c = G.byId[S.sel[0]];
    if (!c || !c.parent_id) { S.changes = { note: "first", rows: [] }; return; }
    a = c.parent_id; b = c.id;
  } else {
    const [x, y] = S.sel.map((id) => G.byId[id]).filter(Boolean);
    if (!x || !y) { S.changes = null; return; }
    [a, b] = String(x.committed_at) <= String(y.committed_at) ? [x.id, y.id] : [y.id, x.id];
  }
  const want = `${a}..${b}`;
  S.changes = { a, b, loading: true, rows: [] };
  try {
    const r = await api(`/api/commits/diff?user=${enc(S.user)}&a=${enc(a)}&b=${enc(b)}`);
    if (!S.changes || `${S.changes.a}..${S.changes.b}` !== want) return;

async function pollEvents() {

    const priming = S.seq == null;
    const r = await api(`/api/events?user=${enc(user)}&since=${enc(S.seq == null ? 0 : S.seq)}`);
    if (user !== S.user) return;
    if (r && r.seq != null) S.seq = r.seq;
    const events = (r && r.events) || [];
    if (!priming) for (const ev of events) await handleEvent(ev);
    else if (r && r.seq == null && events.length) S.seq = Math.max(...events.map((e) => Number(e.seq) || 0));
  } catch (_) { /* events endpoint unavailable; try again next tick */ }

}
async function handleEvent(ev) {

  if (c) {
    const cid = c.id || c.commit_id;
    const mid = commitModelId(c) || ev.model_id;
    S.alertMeta = { author: c.author_email, message: c.message, id: cid };
    toast(`New version saved by ${firstName(c.author_email) || "a teammate"}.`);
    const dealId = c.deal_id || ev.deal_id;
    if (mid && mid === S.model) await loadGraph({ fresh: cid });
    else if (!dealId || dealId === S.deal) { await selectDeal(S.deal); if (cid && S.graph && S.graph.byId[cid]) { S.fresh = cid; renderRight(); } }
    if (S.awaitingSave) renderMsgs();

  }
  if (!alert && c && ev.alert_pending) {
    const cid = c.id || c.commit_id;

}
async function pollAlert(cid, user) {

  const nav = $("adminNav"), rl = $("reqLinkWrap");
  if (!nav || !rl) return;
  nav.innerHTML = canManage() ? `<div class="slabel">Administration</div><button class="nav-row ${S.view === "gov" ? "sel" : ""}" id="govNav">${ICON.shield}Access &amp; governance</button>` : "";
  const g = $("govNav"); if (g) g.addEventListener("click", () => setView(S.view === "gov" ? "chat" : "gov"));
  rl.innerHTML = S.me && !canManage() ? `<button class="link req-link" id="reqLink">Request access</button>` : "";
  const r = $("reqLink"); if (r) r.addEventListener("click", openRequest);
}
async function loadGov() {
  const user = S.user;
  try { const g = await api(`/api/governance?user=${enc(user)}`); if (user !== S.user) return; S.gov = g; S.govErr = null; }
  catch (e) { if (user !== S.user) return; S.govErr = e.message; }
  if (S.view === "gov") renderGov();
}
setInterval(() => { if (S.view === "gov" && canManage() && !Object.keys(S.govBusy).length) loadGov(); }, 5000);
const dealName = (id) => { const d = S.gov && S.gov.deals.find((x) => x.id === id); return d ? d.codename : id; };
const possessive = (n) => (/s$/i.test(n) ? `${n}'` : `${n}'s`);
function eventSentence(ev) {
  const who = firstName(ev.email) || ev.email;
  const d = String(ev.detail || "");
  if (ev.action === "question") return `${esc(who)} asked: <span class="q">“${esc(d)}”</span>`;
  if (ev.action === "blocked" || ev.outcome === "blocked") return `<span class="x">Blocked:</span> ${esc(who)} tried to open a deal they are not staffed on`;
  if (ev.action === "staffing") {
    const m = d.match(/^(added|removed)\s+(\S+)\s+(?:to|from)\s+(\S+)/);
    if (m) return `${esc(who)} ${m[1] === "added" ? "added" : "removed"} ${esc(firstName(m[2]) || m[2])} ${m[1] === "added" ? "to" : "from"} ${esc(dealName(m[3]))}`;
  }
  if (ev.action === "access_request") return `${esc(who)} requested access: <span class="q">“${esc(d)}”</span>`;
  if (ev.action === "access_decision") {
    const m = d.match(/^(approved|declined)\s+request\s+\S+\s+from\s+(\S+)/);
    if (m) return `${esc(who)} ${m[1]} ${esc(possessive(firstName(m[2]) || m[2]))} access request`;
  }
  return `${esc(who)}: ${esc(d)}`;
}
function govMatrix(g) {
  return `<div class="card gcard"><h3>Who can see what</h3><p class="sub">Each switch staffs a person on a deal. Their next question uses the new access right away.</p>
    <div style="overflow-x:auto"><table class="matrix"><thead><tr><th>Person</th>${g.deals.map((d) => `<th>${esc(d.codename)}<span class="co">${esc(d.company)}</span></th>`).join("")}</tr></thead>
    <tbody>${g.users.map((u) => `<tr><td><div class="pn">${esc(u.name)}</div><div class="pt">${esc(u.title)}</div></td>${g.deals.map((d) => {
      const on = (d.team || []).includes(u.email), k = d.id + "|" + u.email;
      return `<td><button class="sw ${on ? "on" : ""}" data-deal="${esc(d.id)}" data-member="${esc(u.email)}" ${S.govBusy[k] ? "disabled" : ""} role="switch" aria-checked="${on}" aria-label="${esc(u.name)} on ${esc(d.codename)}"></button></td>`;
    }).join("")}</tr>`).join("")}</tbody></table></div></div>`;
}
function govRequests(g) {
  const reqs = g.requests || [];
  const pending = reqs.filter((r) => r.status === "pending"), done = reqs.filter((r) => r.status !== "pending");
  const opts = g.deals.map((d) => `<option value="${esc(d.id)}">${esc(d.codename)}</option>`).join("");
  const row = (r) => r.status === "pending"
    ? `<div class="rq"><div class="body"><div class="who">${esc(nameOf(r.email))}<span class="when">${esc(whenText(r.created_at))}</span></div><div class="why">“${esc(r.reason)}”</div></div>
        <div class="acts"><select data-rqdeal="${r.id}"><option value="">Choose a deal</option>${opts}</select>
        <button class="btn sm" data-approve="${r.id}" ${S.govBusy["rq" + r.id] ? "disabled" : ""}>Approve</button><button class="btn sm ghost" data-decline="${r.id}" ${S.govBusy["rq" + r.id] ? "disabled" : ""}>Decline</button></div></div>`
    : `<div class="rq done"><div class="body"><div class="who">${esc(nameOf(r.email))}<span class="when">${esc(whenText(r.created_at))}</span></div><div class="why">“${esc(r.reason)}”</div>
        <div class="st">${r.status === "approved" ? `Approved for ${esc(dealName(r.deal_id))}` : "Declined"}${r.decided_by ? ` by ${esc(firstName(r.decided_by))}` : ""}${r.decided_at ? ` · ${esc(whenText(r.decided_at))}` : ""}</div></div></div>`;
  return `<div class="card gcard"><h3>Access requests</h3><p class="sub">${pending.length ? `${pending.length} waiting for a decision.` : "Nothing waiting for a decision."}</p>
    ${pending.map(row).join("")}${done.map(row).join("")}${!reqs.length ? "" : ""}</div>`;
}
function govActivity(g) {
  const all = (g.log || []).slice().sort((a, b) => String(b.ts).localeCompare(String(a.ts)) || (b.id || 0) - (a.id || 0));
  const rows = S.govBlockedOnly ? all.filter((e) => e.action === "blocked" || e.outcome === "blocked") : all;
  const shown = rows.slice(0, S.govLimit);
  return `<div class="card gcard"><h3>Activity</h3><p class="sub">Every question and access change, newest first.</p>
    <div class="chips"><button class="chip ${S.govBlockedOnly ? "" : "on"}" data-filter="all">Everything</button><button class="chip ${S.govBlockedOnly ? "on" : ""}" data-filter="blocked">Blocked only</button></div>
    ${shown.length ? shown.map((e) => `<div class="ev ${e.action === "blocked" || e.outcome === "blocked" ? "blocked" : ""}"><span class="t">${esc(whenText(e.ts))}</span><span class="d"></span><span>${eventSentence(e)}</span></div>`).join("")
      : `<div class="muted" style="font-size:13px">${S.govBlockedOnly ? "Nothing has been blocked." : "No activity yet."}</div>`}
    ${rows.length > shown.length ? `<div style="margin-top:10px"><button class="link" id="govMore">Show more (${rows.length - shown.length})</button></div>` : ""}</div>`;
}
function renderGov() {
  const box = $("gov");
  if (S.view !== "gov") return;
  const top = box.scrollTop;
  const head = `<div><h2>Access &amp; governance</h2><p class="lead">Decide who can see each deal. Changes apply to the next question — nothing is re-indexed.</p></div>`;
  if (S.govErr) box.innerHTML = `<div class="gov-in">${head}<div class="notice">${esc(S.govErr)}</div></div>`;
  else if (!S.gov) box.innerHTML = `<div class="gov-in">${head}<div class="thinking"><span class="spinner"></span>Loading...</div></div>`;
  else box.innerHTML = `<div class="gov-in">${head}${govMatrix(S.gov)}${govRequests(S.gov)}${govActivity(S.gov)}</div>`;
  box.scrollTop = top;
  box.querySelectorAll(".sw").forEach((b) => b.addEventListener("click", () => toggleStaff(b.dataset.deal, b.dataset.member, !b.classList.contains("on"))));
  box.querySelectorAll("[data-approve]").forEach((b) => b.addEventListener("click", () => decide(b.dataset.approve, true)));
  box.querySelectorAll("[data-decline]").forEach((b) => b.addEventListener("click", () => decide(b.dataset.decline, false)));
  box.querySelectorAll("[data-filter]").forEach((b) => b.addEventListener("click", () => { S.govBlockedOnly = b.dataset.filter === "blocked"; S.govLimit = 30; renderGov(); }));
  const gm = $("govMore"); if (gm) gm.addEventListener("click", () => { S.govLimit += 30; renderGov(); });
}
async function toggleStaff(deal, member, staffed) {
  const k = deal + "|" + member;
  S.govBusy[k] = true; renderGov();
  try {
    const g = await api("/api/governance/staffing", { method: "POST", body: JSON.stringify({ user: S.user, deal, member, staffed }) });
    if (g && g.deals) S.gov = g; else await loadGov();
    const who = firstName(member) || member;
    toast(staffed ? `${who} can now see ${dealName(deal)}. This applies to ${possessive(who)} next question — nothing is re-indexed.`
      : `${who} can no longer see ${dealName(deal)}. This applies to ${possessive(who)} next question.`);
    if (member === S.user) { const me = await api(`/api/me?user=${enc(S.user)}`).catch(() => null); if (me) { S.me = me; renderDeals(); } }
  } catch (e) { toast(e.message, "err"); }
  delete S.govBusy[k]; renderGov();
}
async function decide(id, approve) {
  const sel = document.querySelector(`[data-rqdeal="${id}"]`);
  const deal = sel ? sel.value : "";
  if (approve && !deal) { toast("Choose which deal to grant first.", "err"); if (sel) sel.focus(); return; }
  S.govBusy["rq" + id] = true; renderGov();
  try {
    const body = { user: S.user, approve }; if (approve) body.deal = deal;
    await api(`/api/access-requests/${enc(id)}/decide`, { method: "POST", body: JSON.stringify(body) });
    toast(approve ? `Approved. Access to ${dealName(deal)} applies to their next question.` : "Request declined.");
    await loadGov();
  } catch (e) { toast(e.message, "err"); }
  delete S.govBusy["rq" + id]; renderGov();
}
async function openRequest() {
  S.reqOpen = true; S.reqMine = null; renderRequest();
  const user = S.user;
  try { const r = await api(`/api/access-requests/mine?user=${enc(user)}`); if (user === S.user) { S.reqMine = r.requests || []; renderRequest(); } } catch (_) { S.reqMine = []; renderRequest(); }
}
function renderRequest() {
  const root = $("modalRoot");
  if (!S.reqOpen) { root.innerHTML = ""; return; }
  const mine = S.reqMine;
  root.innerHTML = `<div class="modal-bg" id="reqBg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="reqTitle">
    <h3 id="reqTitle">Request access</h3><p>Compliance reviews every request. You'll see the decision here.</p>
    <textarea id="reqText" placeholder="What do you need and why?">${esc(S.reqText)}</textarea>
    <div class="row"><button class="btn sm ghost" id="reqCancel">Close</button><button class="btn sm" id="reqSend" ${S.reqBusy ? "disabled" : ""}>${S.reqBusy ? "Sending..." : "Send request"}</button></div>
    ${mine == null ? "" : mine.length ? `<div class="mine"><h4>Your requests</h4>${mine.map((r) => `<div class="mr"><span>${esc(r.reason)}<span class="faint"> · ${esc(whenText(r.created_at))}</span></span><span class="s ${esc(r.status)}">${esc(r.status.charAt(0).toUpperCase() + r.status.slice(1))}</span></div>`).join("")}</div>` : ""}
  </div></div>`;
  const ta = $("reqText"); ta.addEventListener("input", () => { S.reqText = ta.value; }); setTimeout(() => ta.focus(), 0);
  $("reqCancel").addEventListener("click", () => { S.reqOpen = false; renderRequest(); });
  $("reqBg").addEventListener("click", (e) => { if (e.target.id === "reqBg") { S.reqOpen = false; renderRequest(); } });
  $("reqSend").addEventListener("click", sendRequest);
}
async function sendRequest() {
  const reason = String(S.reqText || "").trim();
  if (!reason) { $("reqText").focus(); return; }
  S.reqBusy = true; renderRequest();
  try {
    await api("/api/access-requests", { method: "POST", body: JSON.stringify({ user: S.user, reason }) });
    S.reqText = ""; toast("Request sent to Compliance.");
    const r = await api(`/api/access-requests/mine?user=${enc(S.user)}`).catch(() => ({ requests: [] }));
    S.reqMine = r.requests || [];
  } catch (e) { toast(e.message, "err"); }
  S.reqBusy = false; renderRequest();
}
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && S.reqOpen) { S.reqOpen = false; renderRequest(); } });

/* ---------- user switching ---------- */
async function selectUser(email) {
  S.user = email; S.messages = []; S.busy = false; S.me = null; S.alert = null; S.alertMeta = null; S.alertOpen = false; S.deal = null; S.models = []; S.model = null; S.graph = null;
  S.sel = []; S.changes = null; S.fresh = null; S.awaitingSave = false; S.seq = null; S.alertPolls = {}; S.compare = false; S.openSources = {}; S.importOpen = false; S.moreOpen = false; S.gov = null; S.reqOpen = false; S.reqMine = null; S.reqText = ""; setView("chat");
  try { localStorage.setItem("prov_user", email); } catch (_) {}
  renderWho(); renderMsgs();
  try {
    S.me = await api(`/api/me?user=${encodeURIComponent(email)}`);
  } catch (e) {
    $("topbar").innerHTML = `<span class="deal">${esc(e.message)}</span>`; return;
  }
  if (email !== S.user) return;
  renderDeals(); renderTop(); renderMsgs();
  const deals = S.me.deals || [];
  const def = deals.find((d) => d.id === "falcon") || deals[0];
  if (def) await selectDeal(def.id); else renderRight();
}

/* ---------- init ---------- */
document.addEventListener("click", () => { let dirty = false; if (S.whoOpen) { S.whoOpen = false; renderWho(); } if (S.moreOpen) { S.moreOpen = false; dirty = true; } if (dirty) renderRight(); });
$("form").addEventListener("submit", (e) => { e.preventDefault(); const v = $("input").value; $("input").value = ""; autosize(); ask(v); });
$("input").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); } });
function autosize() { const t = $("input"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 160) + "px"; }
$("input").addEventListener("input", autosize);
$("themeBtn").addEventListener("click", () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("prov_theme", root.dataset.theme); } catch (_) {}
});
try { const t = localStorage.getItem("prov_theme"); if (t) document.documentElement.dataset.theme = t; } catch (_) {}

(async function init() {
  try {
    S.users = await api("/api/users");
  } catch (e) {
    $("topbar").innerHTML = `<span class="deal">Can't reach the server</span>`;
    $("msgs").innerHTML = `<div class="empty"><h2>Can't reach the server</h2><p>${esc(e.message)}</p></div>`;
    return;
  }
  let saved = null;
  try { saved = localStorage.getItem("prov_user"); } catch (_) {}
  const first = S.users.find((u) => u.email === saved) || S.users.find((u) => u.email.startsWith("priya")) || S.users[0];
  if (first) selectUser(first.email);
})();

/* ---------- citation links: files open with the viewer's identity, versions open in the timeline ---------- */
document.addEventListener("click", async (e) => {
  const a = e.target.closest("a[href]");
  if (!a) return;
  const href = a.getAttribute("href") || "";
  if (href.startsWith("/files/")) {
    e.preventDefault();
    window.open(`${href}${href.includes("?") ? "&" : "?"}user=${encodeURIComponent(S.user)}`, "_blank", "noopener");
  } else if (href.startsWith("#commit=")) {
    e.preventDefault();
    await focusCommit(href.slice(8));
  } else if (href.startsWith("#model=")) {
    e.preventDefault();
    if (S.models.some((m) => m.id === href.slice(7))) await selectModel(href.slice(7));
  }
});
async function focusCommit(id) {
  const has = () => S.graph && (S.graph.commits || []).some((c) => c.id === id || c.id.startsWith(id));
  if (!has()) {
    for (const m of S.models) {
      if (m.id === S.model) continue;
      await selectModel(m.id);
      if (has()) break;
    }
  }
  if (!has()) { toast("That version is not in the current deal."); return; }
  const full = S.graph.commits.find((c) => c.id === id || c.id.startsWith(id)).id;
  S.compare = false; S.sel = [full]; S.showCells = false;
  renderRight();
  await loadDiff();
  const row = document.querySelector(`.tl-row[data-id="${full}"]`);
  if (row) { row.scrollIntoView({ behavior: "smooth", block: "center" }); row.classList.add("flash"); setTimeout(() => row.classList.remove("flash"), 1600); }
}
</script>

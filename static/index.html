<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Provenance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
:root {
  /* App Starter design system tokens (digohq/app-starter apps/web/src/styles/tokens.css) */
  --color-soil: #0f172a; --color-stem: #4b5563; --color-mist: #e5e7eb; --color-dew: #f9fafb;
  --color-forest: #111827; --color-growth: #1f2937; --color-leaf: #6b7280; --color-spring: #f3f4f6;
  --color-destructive: #b91c1c; --color-destructive-muted: #fef2f2;
  --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.06); --shadow-md: 0 4px 12px rgba(0,0,0,.08); --shadow-lg: 0 8px 24px rgba(0,0,0,.12);
  --transition-micro: 150ms ease-out;
  /* Page roles mapped onto the tokens */
  --bg: #ffffff; --panel: var(--color-dew); --panel-2: #ffffff; --border: var(--color-mist);
  --text: var(--color-soil); --muted: var(--color-stem); --faint: var(--color-leaf);
  --accent: var(--color-forest); --accent-2: var(--color-growth); --accent-soft: var(--color-spring);
  --on-accent: #f9fafb;
  --gold: var(--color-growth); --amber-soft: var(--color-spring);
  --red: var(--color-destructive); --red-soft: var(--color-destructive-muted);
  --green: #15803d; --green-soft: #f0fdf4;
  --shadow: var(--shadow-sm);
  --mono: "IBM Plex Mono", "SF Mono", Monaco, Consolas, monospace;
  --serif: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --color-soil: #f3f4f6; --color-stem: #9ca3af; --color-mist: #374151; --color-dew: #1f2937;
    --color-forest: #f9fafb; --color-growth: #e5e7eb; --color-leaf: #9ca3af; --color-spring: #111827;
    --color-destructive: #f87171; --color-destructive-muted: #3b1414;
    --shadow-sm: 0 1px 3px rgba(0,0,0,.3); --shadow-md: 0 4px 12px rgba(0,0,0,.4); --shadow-lg: 0 8px 24px rgba(0,0,0,.5);
    --bg: #111827; --panel: #1f2937; --panel-2: #111827; --on-accent: #0f172a;
    --green: #4ade80; --green-soft: #052e16;
  }
}
:root[data-theme="dark"] {
  --color-soil: #f3f4f6; --color-stem: #9ca3af; --color-mist: #374151; --color-dew: #1f2937;
  --color-forest: #f9fafb; --color-growth: #e5e7eb; --color-leaf: #9ca3af; --color-spring: #111827;
  --color-destructive: #f87171; --color-destructive-muted: #3b1414;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.3); --shadow-md: 0 4px 12px rgba(0,0,0,.4); --shadow-lg: 0 8px 24px rgba(0,0,0,.5);
  --bg: #111827; --panel: #1f2937; --panel-2: #111827; --on-accent: #0f172a;
  --green: #4ade80; --green-soft: #052e16;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 14px/1.5 "IBM Plex Sans", -apple-system, BlinkMacSystemFont, sans-serif; -webkit-font-smoothing: antialiased;
  display: grid; grid-template-columns: 240px minmax(0, 1fr) 540px; height: 100vh; overflow: hidden;
}
button { font: inherit; cursor: pointer; }
.side, .right { background: var(--panel); border-color: var(--border); overflow-y: auto; }
.side { border-right: 1px solid var(--border); padding: 20px 16px; display: flex; flex-direction: column; gap: 22px; }
.right { border-left: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; gap: 18px; }
.brand h1 { font-size: 22px; font-weight: 700; margin: 0; letter-spacing: -.025em; color: var(--text); }
.brand .firm { font-size: 12px; color: var(--muted); font-weight: 500; margin-top: 2px; }
.brand p { margin: 10px 0 0; font-size: 12px; color: var(--faint); line-height: 1.5; }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); font-weight: 600; margin: 0 0 8px; }
.users { display: flex; flex-direction: column; gap: 4px; }
.user-btn { display: flex; align-items: center; gap: 10px; text-align: left; padding: 8px 10px; border: 1px solid transparent; border-radius: var(--radius-sm); transition: background var(--transition-micro); background: none; color: var(--text); }
.user-btn:hover { background: var(--panel-2); }
.user-btn.active { background: var(--panel-2); border-color: var(--border); box-shadow: var(--shadow-sm); }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--color-mist); color: var(--text); display: grid; place-items: center; font-weight: 600; font-size: 12px; flex: none; }
.user-btn .n { font-weight: 600; font-size: 13px; }
.user-btn .t { font-size: 11px; color: var(--muted); }
.deal-card { border: 1px solid var(--border); border-radius: var(--radius-sm); box-shadow: var(--shadow-sm); padding: 8px 10px; margin-bottom: 6px; background: var(--panel-2); cursor: pointer; }
.deal-card.sel { border-color: var(--accent); }
.deal-card .c { font-weight: 600; font-size: 13px; }
.deal-card .m { font-size: 11px; color: var(--muted); }
.pill { display: inline-flex; align-items: center; font-size: 11px; padding: 1px 9px; border-radius: 99px; border: 1px solid var(--border); background: var(--panel-2); color: var(--muted); font-weight: 600; }
.wall { border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px 14px; background: var(--panel-2); font-size: 12px; color: var(--muted); box-shadow: var(--shadow-sm); }
.wall b { display: block; font-size: 13px; margin-bottom: 4px; color: var(--text); }
.wall .lock { font-family: var(--mono); color: var(--gold); margin-right: 4px; }
.theme-toggle { margin-top: auto; background: var(--panel-2); border: 1px solid var(--border); color: var(--text); border-radius: var(--radius-sm); height: 32px; font-size: 12px; font-weight: 500; }
/* Chat */
.center { display: flex; flex-direction: column; min-width: 0; height: 100vh; }
.topbar { padding: 14px 28px; border-bottom: 1px solid var(--border); background: var(--panel); display: flex; align-items: center; justify-content: space-between; }
.topbar .who { font-size: 13px; color: var(--muted); }
.topbar .who b { color: var(--text); }
.acl { font-family: var(--mono); font-size: 11px; color: var(--faint); }
.msgs { flex: 1; overflow-y: auto; padding: 28px; display: flex; flex-direction: column; gap: 18px; }
.empty { margin: auto; text-align: center; max-width: 560px; }
.empty h2 { font-size: 30px; font-weight: 700; letter-spacing: -.025em; margin: 0 0 8px; }
.empty p { color: var(--muted); margin: 0 0 20px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.chip { border: 1px solid var(--border); background: var(--panel-2); color: var(--text); border-radius: var(--radius-sm); padding: 8px 14px; font-size: 13px; font-weight: 500; box-shadow: var(--shadow-sm); transition: background var(--transition-micro), border-color var(--transition-micro); }
.chip:hover { background: var(--accent-soft); border-color: var(--color-leaf); }
.msg { max-width: 820px; width: 100%; }
.msg.user { align-self: flex-end; max-width: 620px; width: auto; background: var(--accent); color: var(--on-accent); padding: 10px 16px; border-radius: var(--radius-md) var(--radius-md) 4px var(--radius-md); }
.msg.bot { background: var(--panel-2); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px 24px; box-shadow: var(--shadow-sm); }
.msg.err { border-color: var(--red); background: var(--red-soft); }
.md { overflow-wrap: anywhere; }
.md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
.md h1, .md h2, .md h3 { font-size: 15px; margin: 14px 0 6px; }
.md table { border-collapse: collapse; margin: 8px 0; font-size: 13px; }
.md th, .md td { border: 1px solid var(--border); padding: 4px 8px; text-align: left; }
.md code { font-family: var(--mono); font-size: 12px; background: var(--panel-2); padding: 1px 4px; border-radius: 4px; }
.md blockquote { margin: 8px 0; padding: 4px 12px; border-left: 3px solid var(--gold); color: var(--muted); }
.cites { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--border); }
.cite { font-size: 11px; border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px; background: var(--panel-2); color: var(--text); }
.cite .k { color: var(--gold); text-transform: uppercase; font-weight: 600; letter-spacing: .04em; margin-right: 5px; font-size: 10px; }
details.trace { margin-top: 10px; }
details.trace summary { cursor: pointer; font-size: 12px; color: var(--accent); font-weight: 600; list-style: none; }
details.trace summary::-webkit-details-marker { display: none; }
details.trace summary::before { content: "\25B8  "; }
details.trace[open] summary::before { content: "\25BE  "; }
.steps { margin: 10px 0 0 4px; border-left: 2px solid var(--border); padding-left: 14px; display: flex; flex-direction: column; gap: 10px; }
.step { position: relative; font-size: 12px; }
.step::before { content: ""; position: absolute; left: -20px; top: 5px; width: 10px; height: 10px; border-radius: 50%; background: var(--panel); border: 2px solid var(--accent); }
.step .tn { font-family: var(--mono); font-weight: 500; color: var(--accent); }
.step .src { font-size: 10px; padding: 0 6px; border-radius: 4px; margin-left: 6px; font-weight: 600; text-transform: uppercase; }
.src.db { background: var(--color-mist); color: var(--text); }
.src.brain { background: var(--accent); color: var(--on-accent); }
.step .in { font-family: var(--mono); color: var(--muted); font-size: 11px; overflow-wrap: anywhere; }
.step .sm { color: var(--text); }
.loading { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; }
.spinner { width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.composer { padding: 16px 28px 22px; border-top: 1px solid var(--border); background: var(--panel); }
.composer form { display: flex; gap: 10px; max-width: 900px; margin: 0 auto; }
.composer textarea { flex: 1; resize: none; border: 1px solid var(--border); border-radius: var(--radius-sm); box-shadow: var(--shadow-sm); padding: 11px 14px; font: inherit; background: var(--panel-2); color: var(--text); min-height: 46px; max-height: 160px; }
.composer textarea:focus { outline: none; border-color: var(--accent); }
.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent); border-radius: var(--radius-sm); padding: 0 16px; min-height: 40px; font-size: 14px; font-weight: 500; transition: opacity var(--transition-micro); }
.btn:hover:not(:disabled) { opacity: .9; }
.btn:disabled { opacity: .5; cursor: default; }
.mini-chips { display: flex; gap: 6px; flex-wrap: wrap; max-width: 900px; margin: 0 auto 10px; }
.mini-chips .chip { font-size: 12px; padding: 4px 10px; box-shadow: none; }
/* Right panel */
.rhead { display: flex; align-items: baseline; justify-content: space-between; }
.rhead h3 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -.025em; }
.rhead .sub { font-size: 12px; color: var(--muted); }
.timeline { display: flex; flex-direction: column; gap: 8px; }
.ver { border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px 14px; background: var(--panel-2); box-shadow: var(--shadow-sm); cursor: pointer; transition: border-color .15s; }
.ver:hover { border-color: var(--accent-2); }
.ver.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), var(--shadow-md); }
.ver.fresh { animation: flash 1.6s ease-out; }
@keyframes flash { 0% { background: var(--amber-soft); } 100% { background: var(--panel-2); } }
.ver .top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
.ver .vn { font-family: var(--mono); font-weight: 600; font-size: 13px; }
.ver .meta { font-size: 11px; color: var(--muted); }
.ver .note { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.mt { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px; }
.mt .ml { font-size: 9px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); }
.mt .mv { font-family: var(--mono); font-size: 12px; font-weight: 500; }
.d { font-family: var(--mono); font-size: 10px; display: block; }
.d.up { color: var(--green); } .d.down { color: var(--red); }
.hint { font-size: 11px; color: var(--faint); }
table.changes { width: 100%; border-collapse: collapse; font-size: 12px; }
table.changes th { text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); font-weight: 600; padding: 4px 6px; border-bottom: 1px solid var(--border); }
table.changes td { padding: 5px 6px; border-bottom: 1px solid var(--border); vertical-align: top; }
table.changes td.cell { font-family: var(--mono); color: var(--accent); white-space: nowrap; }
table.changes td.v { font-family: var(--mono); white-space: nowrap; }
.old { color: var(--red); text-decoration: line-through; opacity: .8; }
.new { color: var(--green); font-weight: 500; }
.stale { display: flex; flex-direction: column; gap: 6px; }
.stale-item { border: 1px solid var(--border); border-left: 3px solid var(--red); border-radius: var(--radius-sm); box-shadow: var(--shadow-sm); padding: 8px 10px; background: var(--panel-2); font-size: 12px; }
.stale-item .tt { font-weight: 600; }
.badge-red { display: inline-block; background: var(--red-soft); color: var(--red); font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 99px; text-transform: uppercase; letter-spacing: .04em; }
.badge-ok { display: inline-block; background: var(--green-soft); color: var(--green); font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 99px; text-transform: uppercase; }
.sim { width: 100%; padding: 11px; display: flex; align-items: center; justify-content: center; gap: 8px; }
.alert-card { border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--panel-2); box-shadow: var(--shadow-lg); overflow: hidden; }
.alert-card .ah { background: var(--accent); color: var(--on-accent); padding: 8px 14px; font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; display: flex; justify-content: space-between; }
.alert-card .ab { padding: 12px 14px; font-size: 13px; }
.alert-card .x { background: none; border: none; color: var(--on-accent); font-size: 14px; padding: 0; }
.section { display: flex; flex-direction: column; gap: 8px; }
.empty-r { text-align: center; color: var(--muted); padding: 40px 10px; border: 1px dashed var(--border); border-radius: var(--radius-md); font-size: 13px; }
.notice { font-size: 12px; color: var(--red); background: var(--red-soft); border-radius: 8px; padding: 8px 10px; }
/* Commit graph */
.ractions { display: flex; gap: 8px; }
.ractions .btn { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 36px; font-size: 13px; }
.btn.secondary { background: var(--panel-2); color: var(--text); border-color: var(--border); box-shadow: var(--shadow-sm); }
.import { border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px; background: var(--panel-2); display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow-sm); }
.import .label { margin: 0; }
.import input { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 10px; font: inherit; background: var(--bg); color: var(--text); }
.import input:focus { outline: none; border-color: var(--accent); }
.import .row { display: flex; gap: 8px; } .import .row .btn { min-height: 34px; display: inline-flex; align-items: center; gap: 6px; }
.mhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.mname { font-weight: 600; font-size: 14px; }
.msel { font: inherit; font-weight: 600; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 5px 8px; background: var(--panel-2); color: var(--text); max-width: 240px; }
.graph-wrap { max-height: 46vh; overflow-y: auto; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--panel-2); box-shadow: var(--shadow-sm); }
.graph { position: relative; }
.gsvg { position: absolute; left: 0; top: 0; pointer-events: none; }
.crows { margin-left: var(--gw); }
.crow { display: flex; flex-direction: column; justify-content: center; gap: 3px; padding: 0 10px 0 4px; border-bottom: 1px solid var(--border); cursor: pointer; overflow: hidden; transition: background var(--transition-micro); }
.crow:last-child { border-bottom: none; }
.crow:hover { background: var(--accent-soft); }
.crow.sel { background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent); }
.crow.fresh { animation: flash 2.4s ease-out; }
.cl1, .cl2 { display: flex; align-items: center; gap: 6px; min-width: 0; white-space: nowrap; }
.cl2 { font-size: 11px; color: var(--muted); }
.hash { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.cmsg { font-size: 12.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.ref-head { font-size: 10px; font-weight: 600; padding: 0 6px; border-radius: 99px; color: #fff; background: var(--lane); flex: none; }
.ref-tag { font-size: 10px; font-weight: 600; padding: 0 6px; border-radius: 99px; border: 1px solid var(--border); color: var(--muted); background: var(--bg); flex: none; max-width: 120px; overflow: hidden; text-overflow: ellipsis; }
.av { width: 18px; height: 18px; border-radius: 50%; background: var(--color-mist); color: var(--text); display: inline-grid; place-items: center; font-size: 9px; font-weight: 600; flex: none; }
.fork { font-style: italic; }
.qd { font-family: var(--mono); font-size: 10px; color: var(--text); background: var(--accent-soft); border-radius: 4px; padding: 0 5px; overflow: hidden; text-overflow: ellipsis; }
.node-fresh { animation: pop 1.2s ease-out; transform-origin: center; transform-box: fill-box; }
@keyframes pop { 0% { transform: scale(2.2); opacity: .2; } 60% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(1); } }
.csel { border: 1px solid var(--border); border-radius: var(--radius-md); padding: 10px 12px; background: var(--panel-2); display: flex; flex-direction: column; gap: 6px; box-shadow: var(--shadow-sm); }
.cselh { font-size: 13px; } .csel code { font-family: var(--mono); font-size: 11px; }
.fx { font-family: var(--mono); font-size: 10px; margin-top: 2px; white-space: normal; overflow-wrap: anywhere; }
#toasts { position: fixed; right: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 50; max-width: 380px; }
.toast { background: var(--accent); color: var(--on-accent); padding: 10px 14px; border-radius: var(--radius-sm); box-shadow: var(--shadow-lg); font-size: 13px; transition: opacity .3s, transform .3s; }
.toast .hash { color: inherit; opacity: .8; }
.toast.err { background: var(--red); color: #fff; }
.toast.out { opacity: 0; transform: translateY(6px); }
@media (max-width: 1200px) { body { grid-template-columns: 210px minmax(0,1fr) 440px; } }
@media (max-width: 900px) {
  body { grid-template-columns: 1fr; height: auto; overflow: auto; }
  .center { height: auto; min-height: 80vh; }
  .side, .right { border: none; }
  .msgs { padding: 16px; } .composer, .topbar { padding-left: 16px; padding-right: 16px; }
}
</style>
</head>
<body>
<aside class="side">
  <div class="brand">
    <h1>Provenance</h1>
    <div class="firm">Northbeam Capital</div>
    <p>The database knows what changed. The brain knows why.</p>
  </div>
  <div>
    <div class="label">Signed in as (demo)</div>
    <div class="users" id="users"></div>
  </div>
  <div>
    <div class="label">Your deals</div>
    <div id="deals"></div>
  </div>
  <div class="wall" id="wall">
    <b><span class="lock">[#]</span>Ethical walls enforced</b>
    <span id="wallText">Retrieval is filtered by deal membership before anything reaches the model.</span>
  </div>
  <button class="theme-toggle" id="themeBtn">Toggle theme</button>
</aside>

<main class="center">
  <div class="topbar">
    <div class="who" id="who">Loading...</div>
    <div class="acl" id="acl"></div>
  </div>
  <div class="msgs" id="msgs"></div>
  <div class="composer">
    <div class="mini-chips" id="miniChips"></div>
    <form id="form">
      <textarea id="input" rows="1" placeholder="Ask the brain about deals, models, people, decisions..."></textarea>
      <button class="btn" id="send" type="submit">Ask</button>
    </form>
  </div>
</main>

<aside class="right" id="right"></aside>

<script>
const S = { users: [], user: null, me: null, messages: [], busy: false, deal: null, models: [], model: null, graph: null, sel: [], changes: null, stale: null, alert: null, awaitingSave: false, fresh: null, seq: null, alertPolls: {}, importOpen: false, importBusy: false, importPath: "" };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const md = (s) => (window.marked ? marked.parse(String(s ?? ""), { breaks: true }) : "<p>" + esc(s).replace(/\n/g, "<br>") + "</p>");
const initials = (n) => String(n || "?").split(/\s+/).map((p) => p[0]).slice(0, 2).join("").toUpperCase();

const PROMPTS = {

};

async function api(path, opts = {}) {
  const res = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
  let body = null;
  try { body = await res.json(); } catch (_) { body = null; }
  if (!res.ok) {
    const err = new Error((body && (typeof body.detail === "string" ? body.detail : JSON.stringify(body.detail))) || `Request failed (${res.status})`);
    err.status = res.status;
    throw err;
  }
  return body;
}

/* ---------- formatting ---------- */
const pct = (v) => { if (v == null || isNaN(v)) return "--"; const n = Number(v); const p = Math.abs(n) <= 1.5 ? n * 100 : n; return p.toFixed(1).replace(/\.0$/, "") + "%"; };
const money = (v) => (v == null || isNaN(v) ? "--" : "$" + Number(v).toFixed(1) + "M");
const mult = (v) => (v == null || isNaN(v) ? "--" : Number(v).toFixed(1) + "x");
const METRICS = [
  { k: "revenue_growth", l: "Growth", f: pct, pctPts: true },
  { k: "fy26_ebitda", l: "FY26 EBITDA", f: money },
  { k: "exit_multiple", l: "Exit", f: mult },
  { k: "irr", l: "IRR", f: pct, pctPts: true },
];
const FMT = { revenue_growth: pct, ebitda_margin: pct, irr: pct, fy26_revenue: money, fy26_ebitda: money, exit_multiple: mult, moic: mult };
const fmtMetric = (k, v) => (FMT[k] ? FMT[k](v) : fmtVal(v));
function fmtVal(v) {
  if (v == null || v === "") return "--";
  if (typeof v === "number") return Math.abs(v) < 1 && v !== 0 ? pct(v) : String(Number(v.toFixed(4)));
  const n = Number(v);
  if (!isNaN(n) && String(v).trim() !== "") return fmtVal(n);
  return String(v);
}
function delta(m, cur, prev) {
  if (prev == null || cur == null) return "";
  const a = Number(cur), b = Number(prev);
  if (isNaN(a) || isNaN(b) || Math.abs(a - b) < 1e-9) return "";
  const d = a - b;
  let txt;
  if (m.pctPts) { const scale = Math.abs(a) <= 1.5 && Math.abs(b) <= 1.5 ? 100 : 1; txt = (d * scale).toFixed(1) + "pp"; }
  else if (m.k === "exit_multiple") txt = d.toFixed(1) + "x";
  else txt = d.toFixed(1);
  return `<span class="d ${d > 0 ? "up" : "down"}">${d > 0 ? "+" : ""}${txt}</span>`;
}
const fmtDate = (s) => { if (!s) return ""; const d = new Date(s); return isNaN(d) ? String(s) : d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }); };
const nameOf = (email) => (S.users.find((u) => u.email === email) || {}).name || email || "";

/* ---------- trace / citations ---------- */
const DB_TOOLS = /list_models|get_model_graph|diff_commits|find_stale_references|list_my_deals|model|commit|diff|stale|deal/i;
function traceHtml(trace) {
  if (!trace || !trace.length) return "";
  const steps = trace.map((t, i) => {
    const isBrain = /brain|search|hydra|memory/i.test(t.tool || "");
    const src = isBrain ? `<span class="src brain">brain</span>` : DB_TOOLS.test(t.tool || "") ? `<span class="src db">database</span>` : "";
    const input = t.input == null ? "" : typeof t.input === "string" ? t.input : JSON.stringify(t.input);
    return `<div class="step"><div><span class="tn">${i + 1}. ${esc(t.tool)}</span>${src}</div>${input ? `<div class="in">${esc(input)}</div>` : ""}${t.summary ? `<div class="sm">${esc(t.summary)}</div>` : ""}</div>`;
  }).join("");
  return `<details class="trace"><summary>How I got this (${trace.length} step${trace.length > 1 ? "s" : ""})</summary><div class="steps">${steps}</div></details>`;
}
function citesHtml(cites) {
  if (!cites || !cites.length) return "";
  return `<div class="cites">${cites.map((c) => `<span class="cite" title="${esc(c.id || "")}"><span class="k">${esc(c.kind || "doc")}</span>${esc(c.title || c.id)}</span>`).join("")}</div>`;
}

function renderMsgs() {
  const box = $("msgs");
  if (!S.messages.length && !S.busy) {
    const u = S.me && S.me.user;
    box.innerHTML = `<div class="empty"><h2>Ask the brain</h2>
      <p>${u ? esc(u.name.split(" ")[0]) + ", answers" : "Answers"} combine hard facts from the deal database with the why from memos, calls and emails, filtered by what you're allowed to see.</p>

    $("miniChips").innerHTML = "";
  } else {
    box.innerHTML = S.messages.map((m) => {
      if (m.role === "user") return `<div class="msg user">${esc(m.content)}</div>`;
      return `<div class="msg bot ${m.error ? "err" : ""}"><div class="md">${md(m.content)}</div>${traceHtml(m.trace)}${citesHtml(m.citations)}</div>`;
    }).join("") + (S.busy ? `<div class="msg bot"><div class="loading"><span class="spinner"></span>Searching the brain...</div></div>` : "");
    $("miniChips").innerHTML = S.busy ? "" : promptsFor(S.user).map((p) => `<button class="chip" data-p="${esc(p)}">${esc(p)}</button>`).join("");
  }
  document.querySelectorAll("[data-p]").forEach((c) => c.addEventListener("click", () => ask(c.dataset.p)));
  box.scrollTop = box.scrollHeight;
  $("send").disabled = S.busy;
}
async function ask(text) {
  text = String(text || "").trim();
  if (!text || S.busy || !S.user) return;
  S.messages.push({ role: "user", content: text });
  S.busy = true; renderMsgs();
  const user = S.user;
  try {
    const history = S.messages.filter((m) => !m.error).map((m) => ({ role: m.role, content: m.content }));
    const r = await api("/api/chat", { method: "POST", body: JSON.stringify({ user, messages: history }) });
    if (user !== S.user) return;
    S.messages.push({ role: "assistant", content: r.answer || "(no answer)", trace: r.tool_trace, citations: r.citations });
  } catch (e) {
    if (user !== S.user) return;
    S.messages.push({ role: "assistant", content: e.message, error: true });
  } finally {
    if (user === S.user) { S.busy = false; renderMsgs(); }
  }
}

/* ---------- right panel: git-style model history ---------- */
const LANE_COLORS = ["#2563eb", "#059669", "#d97706", "#db2777", "#7c3aed", "#0891b2", "#65a30d", "#dc2626"];
const ROW_H = 54, LANE_W = 16, GRAPH_PAD = 12;
const enc = encodeURIComponent;
const shortId = (id) => String(id || "").slice(0, 7);
const commitModelId = (c) => c && (c.model_id || (c.model && (c.model.id || c.model)) || null);
function relTime(s) {
  if (!s) return "";
  const d = new Date(s); if (isNaN(d)) return String(s);
  const sec = (Date.now() - d.getTime()) / 1000, a = Math.abs(sec);
  const f = (n, u) => `${Math.round(n)} ${u}${Math.round(n) === 1 ? "" : "s"} ${sec >= 0 ? "ago" : "from now"}`;
  if (a < 60) return "just now";
  if (a < 3600) return f(a / 60, "min");
  if (a < 86400) return f(a / 3600, "hr");
  if (a < 86400 * 14) return f(a / 86400, "day");
  if (a < 86400 * 60) return f(a / (86400 * 7), "wk");
  return fmtDate(s);
}

async function selectDeal(id) {
  S.deal = id; S.models = []; S.model = null; S.graph = null; S.sel = []; S.changes = null; S.stale = null; S.panelErr = null;
  renderDeals(); renderRight();
  if (!id) return;
  const user = S.user;
  try {
    const [m, st] = await Promise.all([
      api(`/api/deals/${enc(id)}/models?user=${enc(user)}`),
      api(`/api/deals/${enc(id)}/stale?user=${enc(user)}`).catch((e) => ({ error: e.message })),
    ]);
    if (user !== S.user || id !== S.deal) return;
    S.models = Array.isArray(m) ? m : (m && m.models) || [];
    S.stale = st.error ? { error: st.error } : st.stale || [];
    if (S.models.length) { await selectModel(S.models[0].id, { keepPanel: true }); return; }
  } catch (e) {
    if (user !== S.user) return;
    S.panelErr = e.message;
  }
  renderRight();
}

async function selectModel(modelId, opts = {}) {
  S.model = modelId; S.sel = []; S.changes = null;
  if (!opts.keepPanel) renderRight();
  await loadGraph({ selectHead: true });
}

async function loadGraph({ selectHead = false, fresh = null } = {}) {
  if (!S.model) { renderRight(); return; }
  const user = S.user, model = S.model;
  try {
    const g = await api(`/api/models/${enc(model)}/graph?user=${enc(user)}`);
    if (user !== S.user || model !== S.model) return;
    S.graph = normalizeGraph(g);
    S.panelErr = null;
    if (fresh) { S.fresh = fresh; S.sel = [fresh]; await loadDiff(); }
    else if (selectHead && S.graph.commits.length) { S.sel = [S.graph.commits[0].id]; await loadDiff(); }
  } catch (e) {
    if (user !== S.user) return;
    S.panelErr = e.message; S.graph = null;
  }
  renderRight();
}

function normalizeGraph(g) {
  g = g || {};
  const commits = (g.commits || []).filter((c) => c && c.id).map((c) => ({ ...c, tags: c.tags || [] }));
  // Tags may also come as a top-level list: [{commit_id|commit, title|name|doc_title}]
  (g.tags || []).forEach((t) => {
    const cid = t.commit_id || t.commit || t.quoted_commit;
    const c = commits.find((x) => x.id === cid);
    if (c) { const label = t.title || t.name || t.doc_title || t.label; if (label && !c.tags.some((x) => (x.title || x.name || x) === label)) c.tags.push(label); }
  });
  commits.sort((a, b) => String(b.committed_at || "").localeCompare(String(a.committed_at || "")));
  const branches = g.branches || [];
  // Lane per branch: main first, then by first (oldest) appearance.
  const order = [];
  commits.slice().reverse().forEach((c) => { const b = c.branch || "main"; if (!order.includes(b)) order.push(b); });
  branches.forEach((b) => { if (b.name && !order.includes(b.name)) order.push(b.name); });
  order.sort((a, b) => (a === "main" ? -1 : b === "main" ? 1 : 0));
  const lane = Object.fromEntries(order.map((b, i) => [b, i]));
  const heads = {};
  branches.forEach((b) => { if (b.head_commit) (heads[b.head_commit] = heads[b.head_commit] || []).push(b.name); });
  if (!branches.length) order.forEach((b) => { const h = commits.find((c) => (c.branch || "main") === b); if (h) (heads[h.id] = heads[h.id] || []).push(b); });
  const byId = Object.fromEntries(commits.map((c) => [c.id, c]));
  return { model: g.model || {}, commits, branches, lane, laneCount: Math.max(order.length, 1), heads, byId };
}

const tagLabel = (t) => (typeof t === "string" ? t : t.title || t.name || t.doc_title || t.label || "");

function graphSvg(G) {
  const width = GRAPH_PAD * 2 + (G.laneCount - 1) * LANE_W;
  const height = G.commits.length * ROW_H;
  const idx = Object.fromEntries(G.commits.map((c, i) => [c.id, i]));
  const x = (c) => GRAPH_PAD + (G.lane[c.branch || "main"] || 0) * LANE_W;
  const y = (i) => i * ROW_H + ROW_H / 2;
  const color = (c) => LANE_COLORS[(G.lane[c.branch || "main"] || 0) % LANE_COLORS.length];
  let edges = "";
  G.commits.forEach((c, i) => {
    const p = c.parent_id && G.byId[c.parent_id];
    if (!p) return;
    const pi = idx[p.id], xc = x(c), xp = x(p), yc = y(i), yp = y(pi);
    const col = color(c);
    if (xc === xp) edges += `<path d="M${xp} ${yp} L${xc} ${yc}" stroke="${col}" />`;
    else {
      const bend = yp - ROW_H;
      edges += `<path d="M${xp} ${yp} C${xp} ${yp - ROW_H * 0.55} ${xc} ${yp - ROW_H * 0.45} ${xc} ${bend} L${xc} ${yc}" stroke="${col}" />`;
    }
  });
  const nodes = G.commits.map((c, i) => {
    const sel = S.sel.includes(c.id);
    return `<circle cx="${x(c)}" cy="${y(i)}" r="${sel ? 6 : 5}" fill="${sel ? color(c) : "var(--panel-2)"}" stroke="${color(c)}" stroke-width="2.5" class="${S.fresh === c.id ? "node-fresh" : ""}" />`;
  }).join("");
  return { width, svg: `<svg class="gsvg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" aria-hidden="true"><g fill="none" stroke-width="2" stroke-linecap="round">${edges}</g>${nodes}</svg>` };
}

function metricDeltaRow(c) {
  const p = c.parent_id && S.graph && S.graph.byId[c.parent_id];
  const m = c.metrics || {}, pm = (p && p.metrics) || {};
  const cells = METRICS.filter((mm) => m[mm.k] != null).map((mm) => `<div class="mt"><div class="ml">${mm.l}</div><div class="mv">${mm.f(m[mm.k])}</div>${p ? delta(mm, m[mm.k], pm[mm.k]) : ""}</div>`);
  return cells.length ? `<div class="metrics" style="grid-template-columns:repeat(${cells.length},1fr)">${cells.join("")}</div>` : "";
}

function commitRows(G) {
  return G.commits.map((c) => {
    const col = LANE_COLORS[(G.lane[c.branch || "main"] || 0) % LANE_COLORS.length];
    const sel = S.sel.includes(c.id);
    const heads = (G.heads[c.id] || []).map((b) => `<span class="ref-head" style="--lane:${col}">${esc(b)}</span>`).join("");
    const tags = (c.tags || []).map(tagLabel).filter(Boolean).map((t) => `<span class="ref-tag" title="Pinned by ${esc(t)}">${esc(t)}</span>`).join("");
    const p = c.parent_id && G.byId[c.parent_id];
    const forkNote = p && (p.branch || "main") !== (c.branch || "main") ? `<span class="fork">forked from ${esc(p.branch || "main")}</span>` : "";
    const m = c.metrics || {}, pm = (p && p.metrics) || {};
    const quick = METRICS.filter((mm) => m[mm.k] != null && p && pm[mm.k] != null && Math.abs(Number(m[mm.k]) - Number(pm[mm.k])) > 1e-9)
      .slice(0, 2).map((mm) => `<span class="qd">${mm.l} ${mm.f(pm[mm.k])} &rarr; ${mm.f(m[mm.k])}</span>`).join("");
    return `<div class="crow ${sel ? "sel" : ""} ${S.fresh === c.id ? "fresh" : ""}" data-id="${esc(c.id)}" style="height:${ROW_H}px" title="${esc(c.message || "")}">
      <div class="cl1"><span class="hash">${esc(shortId(c.id))}</span>${heads}${tags}<span class="cmsg">${esc(c.message || "(no message)")}</span></div>
      <div class="cl2"><span class="av" title="${esc(nameOf(c.author_email))}">${esc(initials(nameOf(c.author_email)))}</span><span title="${esc(fmtDate(c.committed_at))}">${esc(relTime(c.committed_at))}</span>${forkNote}${quick}</div>
    </div>`;
  }).join("");
}

function graphHtml() {
  const G = S.graph;
  if (!G) return `<div class="hint">Loading commit graph...</div>`;
  if (!G.commits.length) return `<div class="empty-r">No commits for this model yet.</div>`;
  const { width, svg } = graphSvg(G);
  return `<div class="graph-wrap"><div class="graph" style="--gw:${width}px">${svg}<div class="crows">${commitRows(G)}</div></div></div>`;
}

function selectedSummary() {
  const G = S.graph;
  if (!G || !S.sel.length) return "";
  const c = G.byId[S.sel[S.sel.length - 1]];
  if (!c) return "";
  return `<div class="csel"><div class="cselh"><span class="hash">${esc(shortId(c.id))}</span> <b>${esc(c.message || "")}</b></div>
    <div class="hint">${esc(nameOf(c.author_email))} &middot; ${esc(fmtDate(c.committed_at))} &middot; branch <code>${esc(c.branch || "main")}</code>${c.file_path ? ` &middot; ${esc(String(c.file_path).split("/").pop())}` : ""}</div>
    ${metricDeltaRow(c)}</div>`;
}

async function loadDiff() {
  const G = S.graph;
  if (!G || !S.sel.length) { S.changes = null; return; }
  let a, b;
  if (S.sel.length === 1) {
    const c = G.byId[S.sel[0]];
    if (!c || !c.parent_id) { S.changes = { note: "Root commit: first time this model was seen.", rows: [] }; return; }
    a = c.parent_id; b = c.id;
  } else {
    const [x, y] = S.sel.map((id) => G.byId[id]).filter(Boolean);
    if (!x || !y) { S.changes = null; return; }
    [a, b] = String(x.committed_at) <= String(y.committed_at) ? [x.id, y.id] : [y.id, x.id];
  }
  const want = `${a}..${b}`;
  S.changes = { a, b, loading: true, rows: [] };
  try {
    const r = await api(`/api/commits/diff?user=${enc(S.user)}&a=${enc(a)}&b=${enc(b)}`);
    if (!S.changes || `${S.changes.a}..${S.changes.b}` !== want) return;
    S.changes = { a, b, rows: Array.isArray(r) ? r : r.changes || [] };
  } catch (e) { S.changes = { a, b, error: e.message, rows: [] }; }
}

async function clickCommit(id, multi) {
  if (multi) {
    const i = S.sel.indexOf(id);
    if (i >= 0) S.sel.splice(i, 1); else { S.sel.push(id); if (S.sel.length > 2) S.sel.shift(); }
  } else S.sel = [id];
  S.fresh = null;
  renderRight();
  await loadDiff(); renderRight();
}

function changesHtml() {
  const c = S.changes;
  if (!c) return `<div class="hint">Click a commit to diff it against its parent. Shift- or Cmd-click a second commit to compare any two.</div>`;
  if (c.loading) return `<div class="loading"><span class="spinner"></span>Diffing cells...</div>`;
  if (c.error) return `<div class="notice">${esc(c.error)}</div>`;
  if (c.note) return `<div class="hint">${esc(c.note)}</div>`;
  if (!c.rows.length) return `<div class="hint">No cell changes between ${esc(shortId(c.a))} and ${esc(shortId(c.b))}.</div>`;
  return `<table class="changes"><thead><tr><th>Cell</th><th>Line item</th><th>Change</th></tr></thead><tbody>${c.rows.map((r) => {
    const fChanged = (r.old_formula || r.new_formula) && r.old_formula !== r.new_formula;
    const f = fChanged ? `<div class="fx"><span class="old">${esc(r.old_formula || "(value)")}</span> &rarr; <span class="new">${esc(r.new_formula || "(value)")}</span></div>` : "";
    return `<tr><td class="cell">${esc(r.sheet ? r.sheet + "!" : "")}${esc(r.cell)}</td><td>${esc(r.label || "")}</td>
    <td class="v"><span class="old">${esc(fmtVal(r.old_value))}</span> &rarr; <span class="new">${esc(fmtVal(r.new_value))}</span>${f}</td></tr>`;
  }).join("")}</tbody></table>`;
}

function staleHtml() {
  const st = S.stale;
  if (st == null) return `<div class="hint">Loading...</div>`;
  if (st.error) return `<div class="notice">${esc(st.error)}</div>`;
  if (!st.length) return `<div><span class="badge-ok">All current</span> <span class="hint">No documents quote outdated numbers.</span></div>`;
  const ref = (commit, version) => (commit ? `<span class="hash">${esc(shortId(commit))}</span>` : version != null ? `v${esc(version)}` : "");
  return `<div class="stale">${st.map((r) => `<div class="stale-item">
    <div class="tt">${esc(r.doc_title)} <span class="badge-red">Stale</span></div>
    <div>${esc(String(r.metric || "").replace(/_/g, " "))}: quotes <span class="old">${esc(fmtMetric(r.metric, r.quoted_value))}</span> ${ref(r.quoted_commit, r.quoted_version)}, latest <span class="new">${esc(fmtMetric(r.metric, r.latest_value))}</span> ${ref(r.latest_commit, r.latest_version)}</div>
    ${r.owner_email ? `<div class="hint">Owner: ${esc(nameOf(r.owner_email))}</div>` : ""}</div>`).join("")}</div>`;
}

function alertHtml() {
  if (S.awaitingSave) return `<div class="alert-card"><div class="ab"><div class="loading"><span class="spinner"></span>File saved. Watching the folder, committing, diffing cells and checking the brain for impact...</div></div></div>`;
  if (!S.alert) return "";
  const a = S.alert;
  return `<div class="alert-card"><div class="ah"><span>${a.error ? "Error" : "Proactive alert"}</span><button class="x" id="closeAlert" aria-label="Dismiss">&times;</button></div>
    <div class="ab"><div class="md">${md(a.answer)}</div>${traceHtml(a.tool_trace)}${citesHtml(a.citations)}</div></div>`;
}

function importHtml() {
  if (!S.importOpen) return "";
  return `<form class="import" id="importForm">
    <label class="label" for="importPath">Folder to import</label>
    <input id="importPath" type="text" placeholder="Default: samples/Northbeam Deals" value="${esc(S.importPath || "")}" />
    <div class="hint">One subfolder per deal (deal.json sets the team); _firm is firm-wide. Excel files become commits; PDFs, Word, email and notes go to the brain with the deal's access rules.</div>
    <div class="row"><button class="btn" type="submit" ${S.importBusy ? "disabled" : ""}>${S.importBusy ? `<span class="spinner"></span>Importing...` : "Import"}</button>
    <button class="btn secondary" type="button" id="importCancel">Cancel</button></div></form>`;
}

const canImport = () => { const u = S.me && S.me.user; return !!u && ["managing_partner", "compliance", "principal"].includes(u.role); };
function renderRight() {
  const r = $("right");
  if (!S.me) { r.innerHTML = ""; return; }
  const deals = (S.me && S.me.deals) || [];
  const actions = `<div class="ractions">
      ${canImport() ? `<button class="btn secondary" id="importBtn">Import folder</button>` : ""}
      ${S.deal ? `<button class="btn" id="saveBtn" ${S.awaitingSave ? "disabled" : ""}>${S.awaitingSave ? `<span class="spinner"></span>Waiting...` : "Simulate a save from Excel"}</button>` : ""}
    </div>${importHtml()}`;
  if (!deals.length) {
    r.innerHTML = `<div class="rhead"><h3>Model history</h3></div>${actions}<div class="empty-r">No deal models visible to you.<br><span class="hint">Model history is restricted to deal team members.</span></div>`;
    bindRight(); return;
  }
  const deal = deals.find((d) => d.id === S.deal);
  let body;
  if (S.panelErr) body = `<div class="notice">${esc(S.panelErr)}</div>`;
  else if (!S.models.length) body = `<div class="empty-r">No financial models imported for this deal yet.<br><span class="hint">Import a folder or save an Excel model into it.</span></div>`;
  else {
    const G = S.graph;
    const sel = S.models.length > 1
      ? `<select id="modelSel" class="msel">${S.models.map((m) => `<option value="${esc(m.id)}" ${m.id === S.model ? "selected" : ""}>${esc(m.name || m.id)}</option>`).join("")}</select>`
      : `<div class="mname">${esc(S.models[0].name || S.models[0].id)}</div>`;
    const counts = G ? `${G.commits.length} commit${G.commits.length === 1 ? "" : "s"} &middot; ${G.laneCount} branch${G.laneCount === 1 ? "" : "es"}` : "";
    const rangeLabel = S.changes && S.changes.a ? ` &middot; <span class="hash">${esc(shortId(S.changes.a))}</span>..<span class="hash">${esc(shortId(S.changes.b))}</span>` : "";
    body = `
    <div class="section"><div class="mhead">${sel}<span class="hint">${counts}</span></div>
      ${graphHtml()}
      <div class="hint">Click a commit to diff against its parent &middot; Shift/Cmd-click two to compare</div></div>
    ${selectedSummary()}
    <div class="section"><div class="label">Cell-level changes${rangeLabel}</div>${changesHtml()}</div>
    <div class="section"><div class="label">Stale references</div>${staleHtml()}</div>`;
  }
  r.innerHTML = `<div class="rhead"><h3>Model history</h3><span class="sub">${deal ? esc(deal.codename) + " &middot; " + esc(deal.company) : ""}</span></div>
    ${actions}${alertHtml()}${body}`;
  bindRight();
}

function bindRight() {
  const r = $("right");
  r.querySelectorAll(".crow").forEach((el) => el.addEventListener("click", (e) => clickCommit(el.dataset.id, e.shiftKey || e.metaKey || e.ctrlKey)));
  const ms = $("modelSel"); if (ms) ms.addEventListener("change", () => selectModel(ms.value));
  const ib = $("importBtn"); if (ib) ib.addEventListener("click", () => { S.importOpen = !S.importOpen; renderRight(); const p = $("importPath"); if (p) p.focus(); });
  const ic = $("importCancel"); if (ic) ic.addEventListener("click", () => { S.importOpen = false; renderRight(); });
  const f = $("importForm"); if (f) f.addEventListener("submit", (e) => { e.preventDefault(); runImport($("importPath").value); });
  const sb = $("saveBtn"); if (sb) sb.addEventListener("click", simulateSave);
  const ca = $("closeAlert"); if (ca) ca.addEventListener("click", () => { S.alert = null; renderRight(); });
}

/* ---------- import / simulated save / live events ---------- */
const countOf = (v) => (Array.isArray(v) ? v.length : typeof v === "number" ? v : v ? Object.keys(v).length : 0);
async function runImport(path) {
  if (S.importBusy) return;
  S.importPath = path; S.importBusy = true; renderRight();
  const user = S.user;
  try {
    const body = { user }; if (String(path || "").trim()) body.path = path.trim();
    const r = await api("/api/import", { method: "POST", body: JSON.stringify(body) });
    toast(`Imported: ${countOf(r.commits)} new commit${countOf(r.commits) === 1 ? "" : "s"}, ${countOf(r.docs)} document${countOf(r.docs) === 1 ? "" : "s"}${countOf(r.skipped) ? `, ${countOf(r.skipped)} unchanged/skipped` : ""}.`);
    S.importOpen = false;
    if (user === S.user) await refreshMe();
  } catch (e) { toast("Import failed: " + e.message, "err"); }
  S.importBusy = false; renderRight();
}

async function refreshMe() {
  const user = S.user;
  try { const me = await api(`/api/me?user=${enc(user)}`); if (user !== S.user) return; S.me = me; } catch (_) { return; }
  renderTop(); renderDeals();
  const deals = S.me.deals || [];
  if (!deals.some((d) => d.id === S.deal)) { const def = deals.find((d) => d.id === "falcon") || deals[0]; await selectDeal(def ? def.id : null); }
  else await selectDeal(S.deal);
}

async function simulateSave() {
  if (S.awaitingSave || !S.deal) return;
  S.awaitingSave = true; S.alert = null; renderRight();
  const user = S.user;
  clearTimeout(S.saveTimer);
  S.saveTimer = setTimeout(() => { if (S.awaitingSave) { S.awaitingSave = false; toast("Still processing the save; the alert will appear when ready."); renderRight(); } }, 120000);
  try {
    const r = await api("/api/demo/save", { method: "POST", body: JSON.stringify({ user, deal: S.deal }) });
    const saved = r && (r.saved || r.file || r.path); const name = saved ? String(saved).split("/").pop() : "the model";
    toast(`Saved ${name} into the deal folder. Watching for the commit...`);
    if (r && r.alert) { S.awaitingSave = false; S.alert = r.alert; }
  } catch (e) {
    S.awaitingSave = false;
    if (user === S.user) S.alert = { answer: e.message, error: true };
  }
  renderRight();
}

async function pollEvents() {
  if (!S.user || S.polling) return;
  S.polling = true;
  const user = S.user;
  try {
    const priming = S.seq == null;
    const r = await api(`/api/events?user=${enc(user)}&since=${enc(S.seq == null ? 0 : S.seq)}`);
    if (user !== S.user) return;
    if (r && r.seq != null) S.seq = r.seq;
    const events = (r && r.events) || [];
    if (!priming) for (const ev of events) await handleEvent(ev);
    else if (r && r.seq == null && events.length) S.seq = Math.max(...events.map((e) => Number(e.seq) || 0));
  } catch (_) { /* backend may not expose events yet */ }
  finally { S.polling = false; }
}

async function handleEvent(ev) {
  if (!ev) return;
  const c = ev.commit || (ev.type === "commit" ? ev : null);
  const alert = ev.alert || (c && c.alert);
  if (c) {
    const cid = c.id || c.commit_id;
    const mid = commitModelId(c) || ev.model_id;
    const branch = c.branch ? ` on ${c.branch}` : "";
    toast(`New commit <span class="hash">${esc(shortId(cid))}</span>${esc(branch)}: ${esc(c.message || "model saved")}`, "", true);
    const dealId = c.deal_id || ev.deal_id;
    if (mid && mid === S.model) await loadGraph({ fresh: cid });
    else if (!dealId || dealId === S.deal) { await selectDeal(S.deal); if (cid && S.graph && S.graph.byId[cid]) { S.fresh = cid; renderRight(); } }
  } else if (ev.type === "doc") {
    toast(`New document in the brain: ${esc(ev.title || (ev.doc && ev.doc.title) || ev.doc_id || "")}`, "", true);
  }
  if (!alert && c && ev.alert_pending) {
    const cid = c.id || c.commit_id;
    if (S.awaitingSave || !S.alertPolls[cid]) pollAlert(cid, S.user);
  }
  if (alert) showAlert(alert);
  else if (c && S.awaitingSave) renderRight();
}

async function pollAlert(cid, user) {
  if (S.alertPolls[cid]) return;
  S.alertPolls[cid] = true;
  for (let i = 0; i < 60 && user === S.user; i++) {
    await new Promise((res) => setTimeout(res, 3000));
    if (user !== S.user) break;
    let r = null;
    try { r = await api(`/api/alerts/${enc(cid)}?user=${enc(user)}`); } catch (_) { break; }
    if (r && !r.pending && r.alert) { if (user === S.user) await showAlert(r.alert); break; }
  }
  delete S.alertPolls[cid];
}

async function showAlert(alert) {
  {
    S.awaitingSave = false; clearTimeout(S.saveTimer);
    S.alert = alert; renderRight();
    toast("Proactive alert: the agent assessed the impact of the new commit.");
    const s = await api(`/api/deals/${enc(S.deal)}/stale?user=${enc(S.user)}`).catch(() => null);
    if (s) { S.stale = s.stale || []; renderRight(); }
  }
}

function toast(msg, kind = "", isHtml = false) {
  let box = $("toasts");
  if (!box) { box = document.createElement("div"); box.id = "toasts"; document.body.appendChild(box); }
  const el = document.createElement("div");
  el.className = "toast " + kind;
  el.innerHTML = isHtml ? msg : esc(msg);
  box.appendChild(el);
  setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 300); }, 6000);
}
setInterval(pollEvents, 3000);

/* ---------- user switching ---------- */
async function selectUser(email) {
  S.user = email; S.messages = []; S.busy = false; S.me = null; S.alert = null; S.deal = null; S.models = []; S.model = null; S.graph = null; S.sel = []; S.changes = null; S.fresh = null; S.awaitingSave = false; S.seq = null; S.alertPolls = {};
  try { localStorage.setItem("prov_user", email); } catch (_) {}
  renderUsers(); renderMsgs();
  try {
    S.me = await api(`/api/me?user=${encodeURIComponent(email)}`);
  } catch (e) {
    $("who").textContent = e.message; return;
  }
  if (email !== S.user) return;
  renderTop(); renderDeals(); renderMsgs();
  const deals = S.me.deals || [];
  const def = deals.find((d) => d.id === "falcon") || deals[0];
  if (def) await selectDeal(def.id); else renderRight();
}

/* ---------- init ---------- */
$("form").addEventListener("submit", (e) => { e.preventDefault(); const v = $("input").value; $("input").value = ""; autosize(); ask(v); });
$("input").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); } });
function autosize() { const t = $("input"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 160) + "px"; }
$("input").addEventListener("input", autosize);
$("themeBtn").addEventListener("click", () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("prov_theme", root.dataset.theme); } catch (_) {}
});
try { const t = localStorage.getItem("prov_theme"); if (t) document.documentElement.dataset.theme = t; } catch (_) {}

(async function init() {
  try {
    S.users = await api("/api/users");
  } catch (e) {
    $("who").textContent = "Backend unavailable: " + e.message;
    $("msgs").innerHTML = `<div class="empty"><h2>Backend not reachable</h2><p>${esc(e.message)}</p></div>`;
    return;
  }
  let saved = null;
  try { saved = localStorage.getItem("prov_user"); } catch (_) {}
  const first = S.users.find((u) => u.email === saved) || S.users.find((u) => u.email.startsWith("priya")) || S.users[0];
  renderUsers();
  if (first) selectUser(first.email);
})();
</script>
